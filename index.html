<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/favicon.png">
<meta name="theme-color" content="#0B243A">
<title>NACBA Speaker Docket</title>
<style>
  /* NACBA brand — sampled from the logo files.
     navy #0B243A · mid blue #4F98CA · light blue #BADEF6
     --accent is the brand blue darkened to #1D6091 so small text on white
     clears WCAG AA; --brand keeps the true #4F98CA for bars and fills. */
  :root {
    --ground:#F0F3F6; --surface:#FFF; --surface-2:#F6F8FA;
    --ink:#0B243A; --muted:#52657A; --faint:#8497A9;
    --accent:#1D6091; --brand:#4F98CA; --accent-soft:#E4F0F9;
    --critical:#9E2A33; --critical-soft:#F8E9EA;
    --warn:#8A6210; --warn-soft:#F8F0DE;
    --ok:#2A6650; --ok-soft:#E3F0EA;
    --rule:#D9E0E7; --rule-strong:#BECAD5;
    --shadow:0 1px 2px rgba(11,36,58,.06);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ground:#0A1621; --surface:#0F2130; --surface-2:#152B3C;
    --ink:#E4EDF4; --muted:#9BB0C2; --faint:#7A8FA1;
    --accent:#7FB6DC; --brand:#4F98CA; --accent-soft:#123048;
    --critical:#E58B90; --critical-soft:#3A1E21;
    --warn:#D6AB5C; --warn-soft:#332815;
    --ok:#6FBF9C; --ok-soft:#15302A;
    --rule:#22384A; --rule-strong:#334C60;
    --shadow:0 1px 2px rgba(0,0,0,.35);
  }}
  :root[data-theme="dark"]{
    --ground:#0A1621; --surface:#0F2130; --surface-2:#152B3C;
    --ink:#E4EDF4; --muted:#9BB0C2; --faint:#7A8FA1;
    --accent:#7FB6DC; --brand:#4F98CA; --accent-soft:#123048;
    --critical:#E58B90; --critical-soft:#3A1E21;
    --warn:#D6AB5C; --warn-soft:#332815;
    --ok:#6FBF9C; --ok-soft:#15302A;
    --rule:#22384A; --rule-strong:#334C60;
    --shadow:0 1px 2px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{background:var(--ground);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:16px;line-height:1.55;margin:0;padding:0 1.5rem 5rem;-webkit-font-smoothing:antialiased}

  /* The logo is never recolored. It sits on its own white plate so it
     reads correctly on both the light ground and the dark one. */
  .logo-plate{display:inline-block;background:#FFF;padding:.4rem .55rem;border-radius:3px;
    line-height:0;margin:0 0 .9rem;border:1px solid var(--brand)}
  .logo-plate img{display:block;width:200px;height:auto}
  @media (max-width:34rem){.logo-plate img{width:160px}}
  .wrap{max-width:64rem;margin:0 auto}
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* One typeface throughout. Columns of digits still line up via tabular-nums,
     without setting the whole interface in a face that reads as code. */
  .today,.card-date,.card-days,.card-foot,.a-date,.d-date,.hist-when,
  td.c-off,td.c-date,.sp-meta,.up-meta{font-variant-numeric:tabular-nums}

  /* ---- sign-in ---- */
  .gate{max-width:26rem;margin:0 auto;padding:6rem 0}
  .gate h1{font-size:2rem;letter-spacing:-.02em;font-weight:600;margin:0 0 .75rem;line-height:1.1}
  .gate p{color:var(--muted);font-size:.95rem;margin:0 0 1.75rem}
  .gate form{display:flex;flex-direction:column;gap:.7rem}
  .gate input{font:inherit;padding:.6rem .75rem;border:1px solid var(--rule-strong);
    border-radius:3px;background:var(--surface);color:var(--ink);font-size:.95rem}
  .gate button[type=submit]{background:var(--accent);color:var(--ground);border:none;
    border-radius:3px;padding:.7rem;font-size:.95rem;font-weight:600}
  .msg{font-size:.9rem;padding:.75rem .9rem;border-radius:3px;margin-top:1rem}
  .msg.ok{background:var(--ok-soft);color:var(--ok)}
  .msg.err{background:var(--critical-soft);color:var(--critical)}
  .gate .fine{font-size:.82rem;color:var(--faint);margin-top:1.5rem}

  /* ---- masthead ---- */
  header.masthead{padding:3rem 0 1.5rem;border-bottom:2px solid var(--ink);margin-bottom:2rem;
    display:flex;flex-wrap:wrap;gap:1.25rem;align-items:flex-end;justify-content:space-between}
  .eyebrow{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:0 0 .75rem}
  h1{font-size:clamp(1.9rem,4.5vw,2.5rem);line-height:1.06;letter-spacing:-.02em;font-weight:600;margin:0}
  .masthead-right{display:flex;flex-direction:column;align-items:flex-end;gap:.6rem}
  .today{font-size:.8rem;color:var(--faint);text-align:right}
  .btn-row{display:flex;gap:.4rem;flex-wrap:wrap}
  .btn{background:var(--surface);border:1px solid var(--rule-strong);border-radius:3px;
    padding:.42rem .8rem;font-size:.86rem;font-weight:600;color:var(--muted)}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--ground)}
  .btn.is-here{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .btn.danger{color:var(--critical)}
  .btn.danger:hover{border-color:var(--critical);color:var(--critical)}
  .mini{font-size:.82rem;background:none;border:none;padding:.15rem .3rem;color:var(--faint)}
  .mini:hover{color:var(--accent);text-decoration:underline}
  .mini.danger:hover{color:var(--critical)}
  a.mini{text-decoration:none;white-space:nowrap;align-self:center}

  /* category chips — click to toggle */
  .chips{display:flex;flex-wrap:wrap;gap:.35rem}
  .chip-t{background:var(--surface-2);border:1px solid var(--rule);border-radius:100px;
    padding:.25rem .7rem;font-size:.82rem;color:var(--muted);cursor:pointer;line-height:1.4}
  .chip-t:hover{border-color:var(--accent);color:var(--accent)}
  .chip-t.is-on{background:var(--accent-soft);border-color:var(--brand);color:var(--accent);
    font-weight:600}
  .cat-tags{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.1rem}
  .cat-tag{background:var(--accent-soft);color:var(--accent);border-radius:100px;
    padding:.12rem .55rem;font-size:.74rem;font-weight:600;white-space:nowrap}
  .cat-filter{display:flex;flex-wrap:wrap;gap:.35rem;margin:0 0 1.25rem}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:1px;
    background:var(--rule);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
  .stat{background:var(--surface);padding:.7rem .8rem;display:flex;flex-direction:column;gap:.15rem}
  .stat-k{font-size:.76rem;color:var(--faint)}
  .stat-v{font-size:1.15rem;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}

  /* run sheet — read at a glance, under pressure */
  .crew{padding:.7rem 0;border-top:1px solid var(--rule)}
  .crew:first-of-type{border-top:none;padding-top:0}
  .crew-name{font-weight:600;font-size:1.05rem}
  .crew-bit{font-size:.92rem;color:var(--muted);margin-top:.12rem}
  .crew-bit a{color:var(--accent);text-decoration:none}
  .run-phase{margin-bottom:1rem}
  .run-step{display:flex;gap:.75rem;align-items:flex-start;padding:.6rem 0;
    border-top:1px solid var(--rule);cursor:pointer}
  .run-step:first-of-type{border-top:none}
  .run-step input{width:20px;height:20px;accent-color:var(--accent);margin:.1rem 0 0;flex:none}
  .run-text{font-size:1.02rem;line-height:1.45}
  .run-step.is-done .run-text{color:var(--faint);text-decoration:line-through;
    text-decoration-thickness:1px}
  .run-src{display:block;font-size:.76rem;color:var(--faint);text-decoration:none;margin-top:.1rem}
  .run-by{display:inline-block;font-size:.76rem;color:var(--ok);margin-left:.5rem;
    text-decoration:none}
  .callout-note{background:var(--accent-soft);border-left:3px solid var(--brand);
    border-radius:0 4px 4px 0;padding:.9rem 1.1rem;font-size:.93rem;color:var(--ink)}

  /* ---- alerts ---- */
  .alerts{margin-bottom:2rem}
  .alerts-head{font-size:.84rem;font-weight:600;color:var(--critical);margin:0 0 .6rem}
  .alert{display:grid;grid-template-columns:5.5rem 1fr auto;gap:0 1rem;align-items:baseline;
    padding:.65rem .9rem;background:var(--critical-soft);border-left:3px solid var(--critical);
    border-radius:0 3px 3px 0;margin-bottom:2px}
  .a-date{font-size:.84rem;font-weight:600;color:var(--critical);white-space:nowrap}
  .a-text{font-size:.92rem}
  .a-go{font-size:.84rem;font-weight:600;color:var(--critical);
    background:none;border:none;padding:0;white-space:nowrap}
  .a-go:hover{text-decoration:underline}

  /* The roll-up. Collapsed by default: the counts say how bad it is without
     pushing every program card below the fold. Open it for the which-and-why. */
  .alerts-roll{width:100%;display:flex;flex-wrap:wrap;gap:.35rem .7rem;align-items:center;
    text-align:left;background:var(--critical-soft);border:1px solid var(--critical);
    border-left-width:3px;border-radius:0 3px 3px 0;padding:.6rem .9rem}
  .ar-caret{font-size:.62rem;color:var(--critical);flex:none;transition:transform .12s ease}
  .alerts-roll[aria-expanded="true"] .ar-caret{transform:rotate(90deg)}
  .ar-head{font-size:.84rem;font-weight:600;color:var(--critical)}
  .ar-count{font-size:.84rem;color:var(--critical);opacity:.85;font-variant-numeric:tabular-nums}
  .ar-chips{display:flex;flex-wrap:wrap;gap:.3rem;margin-left:auto}
  .ar-chip{font-size:.74rem;font-weight:600;background:var(--surface);color:var(--critical);
    border:1px solid var(--critical);border-radius:100px;padding:.1rem .55rem;white-space:nowrap;
    font-variant-numeric:tabular-nums}
  .alerts-list{margin-top:2px}

  /* ---- comments on a suggestion ----
     Feedback is the whole point of the board, so the count sits on the card
     even while the thread is shut: a conversation nobody can see is a
     conversation nobody joins. */
  .sc-foot{margin-top:.7rem;padding-top:.55rem;border-top:1px solid var(--rule)}
  .sc-toggle{display:inline-flex;align-items:center;gap:.4rem;background:none;
    border:none;padding:0;font-size:.82rem;font-weight:600;color:var(--accent)}
  .sc-toggle:hover{text-decoration:underline}
  .sc-caret{font-size:.58rem;transition:transform .12s ease}
  .sc-toggle[aria-expanded="true"] .sc-caret{transform:rotate(90deg)}
  .sc-thread{margin-top:.6rem;display:flex;flex-direction:column;gap:.55rem}
  .sc-c{border-left:2px solid var(--rule-strong);padding-left:.6rem}
  .sc-who{display:flex;align-items:baseline;gap:.5rem;margin:0;font-size:.8rem;
    font-weight:600;color:var(--muted)}
  .sc-when{font-weight:400;color:var(--faint);font-variant-numeric:tabular-nums}
  .sc-del{margin-left:auto;background:none;border:none;padding:0;font-size:.76rem;
    color:var(--faint)}
  .sc-del:hover{color:var(--critical);text-decoration:underline}
  .sc-body{margin:.15rem 0 0;font-size:.9rem;line-height:1.45;max-width:62ch;
    white-space:pre-wrap}
  .sc-none{margin:0;font-size:.84rem;color:var(--faint)}
  .sc-add{display:flex;gap:.5rem;align-items:flex-start}
  /* The box sits outside .form, so it inherits none of the field styling and
     would otherwise come out in the browser's default monospace. */
  .sc-add textarea{flex:1;font:inherit;font-size:.9rem;line-height:1.5;
    min-height:3.2rem;resize:vertical;padding:.45rem .6rem;
    border:1px solid var(--rule-strong);border-radius:3px;
    background:var(--surface-2);color:var(--ink)}

  /* ---- segmented toggles (cards/calendar, month/quarter) ---- */
  .seg{display:inline-flex;border:1px solid var(--rule-strong);border-radius:3px;overflow:hidden}
  .seg-b{background:var(--surface);border:none;border-left:1px solid var(--rule);
    padding:.42rem .8rem;font-size:.86rem;font-weight:600;color:var(--muted)}
  .seg-b:first-child{border-left:none}
  .seg-b:hover{color:var(--accent)}
  .seg-b.is-on{background:var(--accent-soft);color:var(--accent)}

  /* ---- calendar ---- */
  .cal-bar{display:flex;flex-wrap:wrap;gap:.5rem .9rem;align-items:center;margin:0 0 1rem}
  .cal-bar .spacer{flex:1}
  .cal-nav{display:inline-flex;gap:.3rem}
  .cal-nav .btn{min-width:2.2rem;text-align:center}
  .cal-title{font-size:1.15rem;font-weight:600;letter-spacing:-.012em;margin:0}
  .cal-sub{font-size:.82rem;color:var(--faint);font-variant-numeric:tabular-nums}
  .cal-months{display:grid;gap:1.1rem;grid-template-columns:1fr}
  .cal-months.is-q{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cal-m{background:var(--surface);border:1px solid var(--rule);border-radius:4px;
    padding:.85rem .9rem;box-shadow:var(--shadow);min-width:0}
  .cal-m-head{font-size:.84rem;font-weight:600;color:var(--muted);margin:0 0 .6rem;
    display:flex;justify-content:space-between;gap:.5rem;align-items:baseline}
  .cal-m-head .n{color:var(--faint);font-weight:400;font-variant-numeric:tabular-nums}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;
    background:var(--rule);border:1px solid var(--rule);border-radius:3px;overflow:hidden}
  .cal-dow{background:var(--surface-2);font-size:.68rem;font-weight:600;color:var(--faint);
    text-align:center;padding:.3rem 0;letter-spacing:.04em}
  .cal-d{background:var(--surface);min-height:5rem;padding:.3rem .32rem;display:flex;
    flex-direction:column;gap:2px;min-width:0}
  .cal-d.is-out{background:var(--surface-2)}
  .cal-d.is-today{box-shadow:inset 0 0 0 2px var(--accent)}
  .cal-dn{font-size:.72rem;color:var(--faint);font-variant-numeric:tabular-nums;line-height:1.3}
  .cal-d.is-today .cal-dn{color:var(--accent);font-weight:700}
  .cal-d.is-out .cal-dn{opacity:.45}
  .cal-ev{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;
    width:100%;text-align:left;font-size:.72rem;line-height:1.25;
    font-weight:600;border:none;border-left:3px solid var(--brand);border-radius:0 2px 2px 0;
    background:var(--accent-soft);color:var(--accent);padding:.16rem .3rem;overflow:hidden}
  .cal-ev:hover{outline:1px solid var(--accent)}
  .cal-ev.is-urgent{background:var(--critical-soft);color:var(--critical);
    border-left-color:var(--critical)}
  .cal-ev.is-done{background:var(--surface-2);color:var(--muted);
    border-left-color:var(--rule-strong)}
  /* Three months abreast, or one month on a phone, leaves no room for titles
     in the cell. The dots keep the shape of the month; the list carries the
     names. Only ever one of the two is on screen, so neither is read twice. */
  .cal-dots{display:none;flex-wrap:wrap;gap:2px}
  .cal-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brand)}
  .cal-dot.is-urgent{background:var(--critical)}
  .cal-dot.is-done{background:var(--rule-strong)}
  .cal-months.is-q .cal-ev{display:none!important}
  .cal-months.is-q .cal-dots{display:flex}
  .cal-months.is-q .cal-d{min-height:2.5rem}
  .cal-months:not(.is-q) .cal-list{display:none}
  .cal-list{display:flex;flex-direction:column;margin-top:.65rem}
  .cal-li{display:grid;grid-template-columns:3.4rem 1fr;gap:.1rem .6rem;align-items:baseline;
    text-align:left;background:none;border:none;border-top:1px solid var(--rule);
    padding:.42rem 0;width:100%}
  .cal-li:first-child{border-top:none}
  .cal-li:hover .cal-li-t{color:var(--accent);text-decoration:underline}
  .cal-li-d{font-size:.78rem;font-weight:600;color:var(--accent);white-space:nowrap;
    font-variant-numeric:tabular-nums}
  .cal-li-d.is-urgent{color:var(--critical)}
  .cal-li-d.is-done{color:var(--faint)}
  .cal-li-t{font-size:.87rem;line-height:1.35}
  .cal-empty{font-size:.84rem;color:var(--faint);margin:.6rem 0 0}
  .cal-legend{display:flex;flex-wrap:wrap;gap:.3rem 1.1rem;margin:1rem 0 0;
    font-size:.78rem;color:var(--faint)}
  .cal-legend span{display:inline-flex;align-items:center;gap:.35rem}
  .cal-key{width:9px;height:9px;border-radius:2px;background:var(--brand);flex:none}
  .cal-key.k-urgent{background:var(--critical)}
  .cal-key.k-done{background:var(--rule-strong)}
  @media (max-width:58rem){
    .cal-months.is-q{grid-template-columns:1fr}
    .cal-months.is-q .cal-d{min-height:3.4rem}
  }

  /* ---- tabs ---- */
  .tabs{display:flex;gap:.25rem;margin-bottom:1.5rem;border-bottom:1px solid var(--rule);
    align-items:center;flex-wrap:wrap}
  .tab{background:none;border:none;border-bottom:2px solid transparent;padding:.5rem .9rem;
    font-size:.92rem;font-weight:600;color:var(--faint);margin-bottom:-1px}
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
  .tab .count{opacity:.6;margin-left:.3rem}
  .tabs .spacer{flex:1}

  /* ---- cards ---- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(20rem,1fr));gap:1rem}
  .card{background:var(--surface);border:1px solid var(--rule);border-radius:4px;
    padding:1.1rem 1.2rem 1rem;text-align:left;width:100%;display:flex;flex-direction:column;
    gap:.7rem;box-shadow:var(--shadow);transition:border-color .12s ease}
  .card:hover{border-color:var(--accent)}
  .card.is-past{opacity:.72}
  .card.is-urgent{border-left:3px solid var(--critical)}
  .card-top{display:flex;justify-content:space-between;align-items:baseline;gap:.75rem}
  .card-date{font-size:.86rem;font-weight:600;color:var(--accent);white-space:nowrap}
  .card-days{font-size:.82rem;color:var(--faint);white-space:nowrap}
  .card-days.soon{color:var(--warn)}
  .card h3{font-size:1.02rem;font-weight:600;line-height:1.32;margin:0;letter-spacing:-.004em}
  .speakers-line{font-size:.86rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:.3rem .45rem;align-items:center}
  .sp{display:inline-flex;align-items:center;gap:.3rem}
  .sp-dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
  .sp-dot.un{background:var(--warn)}
  .sp-none{color:var(--critical);font-style:italic}
  .gates{display:flex;gap:.3rem;margin-top:.15rem;padding-top:.7rem;border-top:1px solid var(--rule)}
  .gate-c{flex:1;display:flex;flex-direction:column;gap:.3rem}
  .gate-bar{height:3px;border-radius:2px;background:var(--rule-strong)}
  .gate-c.done .gate-bar{background:var(--ok)}
  .gate-c.late .gate-bar{background:var(--critical)}
  .gate-label{font-size:.68rem;color:var(--faint);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gate-c.done .gate-label{color:var(--ok)}
  .gate-c.late .gate-label{color:var(--critical)}
  .card-foot{font-size:.8rem;color:var(--faint);display:flex;
    justify-content:space-between;gap:.5rem}
  .card-foot .late-n{color:var(--critical);font-weight:600}

  /* ---- detail ---- */
  .back{background:none;border:none;padding:0;font-size:.88rem;font-weight:600;
    color:var(--accent);margin-bottom:1.5rem}
  .back:hover{text-decoration:underline}
  .detail-head{margin-bottom:2rem}
  .detail-head .d-date{font-size:.86rem;
    color:var(--accent);margin:0 0 .6rem;display:flex;gap:1rem;align-items:baseline;flex-wrap:wrap}
  .detail-head h2{font-size:clamp(1.4rem,3.5vw,1.95rem);line-height:1.15;letter-spacing:-.015em;
    font-weight:600;margin:0 0 .85rem;text-wrap:balance;max-width:34ch}
  .detail-head p.desc{color:var(--muted);font-size:.95rem;margin:0;max-width:68ch}
  .detail-head p.desc.missing{color:var(--critical);font-style:italic}
  .panel{background:var(--surface);border:1px solid var(--rule);border-radius:4px;
    padding:1.1rem 1.25rem;margin-bottom:1.75rem;box-shadow:var(--shadow)}
  .panel-head{font-size:.84rem;font-weight:600;color:var(--muted);
    margin:0 0 .9rem;display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
  .sp-row{display:grid;grid-template-columns:1fr auto;gap:.3rem 1rem;padding:.65rem 0;
    border-top:1px solid var(--rule);align-items:center}
  .sp-row:first-of-type{border-top:none;padding-top:0}
  .sp-name{font-weight:600;font-size:.97rem}
  .sp-meta{font-size:.87rem;color:var(--muted);margin-top:.12rem;word-break:break-word}
  .sp-actions{display:flex;gap:.5rem;align-items:center}
  .chip{font-size:.7rem;letter-spacing:.03em;padding:.22rem .5rem;
    border-radius:2px;white-space:nowrap}
  .chip-ok{background:var(--ok-soft);color:var(--ok)}
  .chip-warn{background:var(--warn-soft);color:var(--warn)}
  .empty-note{color:var(--critical);font-style:italic;font-size:.93rem;margin:0 0 .5rem}
  .note-row{border-top:1px solid var(--rule);padding-top:.65rem;margin-top:.35rem;

/* Change history. Deliberately forgiving: history is a nicety, and a
   failure here must never stop a program page from opening. */
async function loadHistory(programId) {
  try {
    let q = sb.from("change_log")
      .select("id, table_name, program_id, label, field, old_value, new_value, changed_by, changed_at")
      .order("changed_at", { ascending: false })
      .limit(40);
    if (programId) q = q.eq("program_id", programId);
    const { data, error } = await q;
    history = error ? [] : (data || []);
  } catch (e) {
    history = [];
  }
}

let audioCache = {};
async function playName(id){
  if (audioCache[id]) { new Audio(audioCache[id]).play(); return; }
  toast("Fetching…");
  const { data, error } = await sb.rpc("name_audio", { p_speaker: id });
  if (error || !data) { toast("No recording for that speaker", true); return; }
  try {
    const bin = atob(data.b64), buf = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) buf[i] = bin.charCodeAt(i);
    audioCache[id] = URL.createObjectURL(new Blob([buf], { type: data.mime }));
    new Audio(audioCache[id]).play();
    toast("Playing " + (data.name || ""));
  } catch (e) { toast("Could not play that recording", true); }
}

function renderAnalytics(){
  const done = programs
    .filter(p => metrics[p.id])
    .sort((a,b) => (a.event_date < b.event_date ? 1 : -1));

  const sum = k => done.reduce((t,p) => {
    const v = num(metrics[p.id][k]); return v === null ? t : t + v; }, 0);
  const counted = k => done.filter(p => num(metrics[p.id][k]) !== null).length;

  const regs = sum("registrations_total"), att = sum("live_attendees"),
        rev  = sum("gross_revenue"), nonm = sum("registrations_nonmember"),
        join = sum("nonmember_joined");

  const head = [
    ["Programs recorded", done.length + " of " + programs.length],
    ["Registrations", counted("registrations_total") ? regs.toLocaleString() : "—"],
    ["Live attendees", counted("live_attendees") ? att.toLocaleString() : "—"],
    ["Attendance rate", (regs > 0 && counted("live_attendees")) ? Math.round(1000*att/regs)/10 + "%" : "—"],
    ["Gross revenue", counted("gross_revenue") ? money(rev) : "—"],
    ["Per attendee", (att > 0 && counted("gross_revenue")) ? money(Math.round(100*rev/att)/100) : "—"],
    ["Non-members", counted("registrations_nonmember") ? nonm.toLocaleString() : "—"],
    ["Joined after outreach", counted("nonmember_joined") ? join.toLocaleString() : "—"],
    ["Conversion", (nonm > 0 && counted("nonmember_joined")) ? Math.round(1000*join/nonm)/10 + "%" : "—"]
  ].map(([k,v]) => '<div class="stat"><span class="stat-k">'+esc(k)+
      '</span><span class="stat-v">'+esc(v)+"</span></div>").join("");

  const rows = done.length ? done.map(p => {
    const m = metrics[p.id], d = derive(m);
    return "<tr><td class=\"c-date\">"+esc(FMT_YEAR.format(parseISO(p.event_date)))+"</td>" +
      "<td class=\"c-task\">"+esc(p.title)+"</td>" +
      "<td class=\"c-by\">"+esc(show(m.registrations_total))+"</td>" +
      "<td class=\"c-by\">"+esc(show(m.live_attendees))+"</td>" +
      "<td class=\"c-by\">"+esc(pct(d.attendance))+"</td>" +
      "<td class=\"c-by\">"+esc(money(m.gross_revenue))+"</td>" +
      "<td class=\"c-by\">"+esc(m.survey_score ? m.survey_score : "—")+"</td>" +
      "<td class=\"c-by\">"+esc(pct(d.conversion))+"</td></tr>";
  }).join("") : '<tr><td colspan="8" style="padding:1rem 0;color:var(--faint)">Nothing recorded yet.</td></tr>';

  const missing = programs.filter(p => !p.archived && isPast(p) && !metrics[p.id]);

  return chrome(
    '<button class="back" data-back>← All programs</button>' +
    '<h2 style="font-size:1.4rem;margin:0 0 .3rem">Analytics</h2>' +
    '<p class="sub" style="color:var(--muted);margin:0 0 1.1rem">Entered by hand after each ' +
    "program. Blanks are genuinely blank — nothing here is averaged from a guess.</p>" +
    '<div class="stats" style="margin-bottom:1.5rem">' + head + "</div>" +
    (missing.length
      ? '<div class="alerts"><p class="alerts-head">' + missing.length +
        " past program" + (missing.length===1?"":"s") + " with no statistics</p>" +
        missing.map(p => '<div class="alert"><span class="a-date">' +
          esc(FMT_YEAR.format(parseISO(p.event_date))) + '</span><span class="a-text">' +
          esc(p.title) + '</span><button class="a-go" data-open="'+p.id+
          '">Record →</button></div>').join("") + "</div>"
      : "") +
    '<section class="panel"><p class="panel-head"><span>By program</span><span>newest first</span></p>' +
    '<div class="dk-scroll"><table class="dk"><thead><tr><th>Date</th><th>Program</th>' +
    "<th>Reg.</th><th>Live</th><th>Rate</th><th>Revenue</th><th>Survey</th><th>Conv.</th>" +
    "</tr></thead><tbody>" + rows + "</tbody></table></div></section>");
}

/* Scheduling turns an idea into a real program: it gets a date, a docket,
   and the idea keeps a link so the season can say where it came from. */
async function scheduleIdea(id){
  const i = ideas.find(x => x.id === id);
  if (!i) return;
  const date = window.prompt(
    "What date? (YYYY-MM-DD)\n\n" + i.title +
    "\n\nThis creates the program and generates its docket.", "");
  if (!date) return;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { toast("Use YYYY-MM-DD", true); return; }

  await mutate(async () => {
    const ins = await sb.from("programs").insert({
      slug: slugFor(date, i.title), event_date: date, title: i.title,
      kind: "paid", description: i.description,
      note: i.speakers_idea ? "From an idea. Possible speakers: " + i.speakers_idea : "From an idea."
    }).select("id").single();
    if (ins.error) return ins;

    // carry the categories across
    const cats = ideaCats[i.id] || [];
    if (cats.length) {
      const r = await sb.from("program_categories")
        .insert(cats.map(c => ({ program_id: ins.data.id, category_id: c })));
      if (r.error) return r;
    }
    return await sb.from("program_ideas")
      .update({ status: "scheduled", program_id: ins.data.id }).eq("id", i.id);
  }, "Scheduled — the docket is generated");
}

   rather than becoming a zero that drags every average down. */

  : "$" + Number(v).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});

function derive(m){
  if (!m) return {};
  const r = num(m.registrations_total), a = num(m.live_attendees),
        g = num(m.gross_revenue), mem = num(m.registrations_member),
        nm = num(m.registrations_nonmember), j = num(m.nonmember_joined);
  return {
    attendance: (r > 0 && a !== null) ? Math.round(1000*a/r)/10 : null,
    perHead:    (a > 0 && g !== null) ? Math.round(100*g/a)/100 : null,
    memberShare:(r > 0 && mem !== null) ? Math.round(1000*mem/r)/10 : null,
    conversion: (nm > 0 && j !== null) ? Math.round(1000*j/nm)/10 : null
  };
}

async function downloadUpload(id, fallbackName) {
  toast("Fetching…");
  const { data, error } = await sb.rpc("upload_bytes", { uid: id });
  if (error || !data) { toast("Could not fetch that file", true); return; }
  try {
    const bin = atob(data.b64);
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([buf], { type: data.mime }));
    const a = document.createElement("a");
    a.href = url; a.download = data.filename || fallbackName || "download";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("Downloaded");
  } catch (e) { toast("Could not decode that file", true); }
}

async function copyInvitation(p, ps) {
  const { text, html } = emailParts(p, ps);
  try {
    if (window.ClipboardItem && navigator.clipboard?.write) {
      await navigator.clipboard.write([new ClipboardItem({
        "text/html":  new Blob([html], { type: "text/html" }),
        "text/plain": new Blob([text], { type: "text/plain" })
      })]);

  } catch (e) {
    window.prompt("Copy this email:", text);
  }

/* ================= derived ================= */
const isPast = p => parseISO(p.event_date) < todayUTC();
const speakersOk = p => p.program_speakers.length>0 &&
  p.program_speakers.every(ps => ps.confirmation==="confirmed");
function taskStatus(p,t){
  const due=addDays(parseISO(p.event_date),t.offset_days), now=todayUTC();
  if (t.done) return "done";
  if (due<now) return "late";
  return diffDays(now,due)<=7 ? "soon" : "open";
}
function gateState(p,key){
  if (key==="speakers") return speakersOk(p) ? "done"
    : (addDays(parseISO(p.event_date),-35)<todayUTC() ? "late":"open");
  const t=p.tasks.find(x=>x.gate_key===key);
  if (!t) return "open";
  const st=taskStatus(p,t);
  return st==="done" ? "done" : (st==="late" ? "late":"open");
}
const lateCount = p => p.tasks.filter(t=>taskStatus(p,t)==="late").length;
function alertsFor(p){
  if (isPast(p)) return [];
  const out=[];
  if (!p.program_speakers.length) out.push("No speakers named");
  else if (!speakersOk(p)) out.push("Speakers not confirmed");
  if (!p.description) out.push("No description for registration");
  const n=lateCount(p);
  if (n) out.push(n+(n===1?" task overdue":" tasks overdue"));
  return out;
}

/* The roll-up answers "how bad is it" in one line; the list below answers
   "which programs". Counted from the same facts alertsFor reads rather than
   by parsing its sentences, so the two cannot drift apart. */
function alertRollup(list){
  let noSpk=0, unconf=0, noDesc=0, late=0;
  list.forEach(p => {
    if (!p.program_speakers.length) noSpk++;
    else if (!speakersOk(p)) unconf++;
    if (!p.description) noDesc++;
    late += lateCount(p);
  });
  return [[noSpk,"without speakers"],[unconf,"awaiting confirmation"],
          [noDesc,"without a description"],
          [late, late===1 ? "task overdue" : "tasks overdue"]]
    .filter(r => r[0]>0).map(r => r[0]+" "+r[1]);
}

/* ================= calendar ================= */
const calPeriod = () => { const base = calAnchor || todayUTC();
  return calSpan==="quarter" ? quarterStart(base) : monthStart(base); };
const evClass = p => isPast(p) ? "is-done" : (alertsFor(p).length ? "is-urgent" : "");

/* One month: the grid, and under it the same programs as a list. CSS shows
   whichever of the two fits — titles in the cells on a wide single month,
   dots plus the list when three months share the width or it is a phone. */
function monthBlock(m, byDate, withHead){
  const mo=m.getUTCMonth(), lead=m.getUTCDay();
  const daysIn = new Date(Date.UTC(m.getUTCFullYear(), mo+1, 0)).getUTCDate();
  const from = addDays(m,-lead), today = todayUTC().getTime();
  const narrow = calSpan==="quarter";
  let grid = DOW.map(d => '<div class="cal-dow">'+(narrow?d.slice(0,1):d)+"</div>").join("");
  const mine = [];
  for (let i=0, cells=Math.ceil((lead+daysIn)/7)*7; i<cells; i++){
    const d=addDays(from,i), out=d.getUTCMonth()!==mo;
    const evs = out ? [] : (byDate[isoOf(d)]||[]);
    evs.forEach(p => mine.push(p));
    grid += '<div class="cal-d'+(out?" is-out":"")+
      (d.getTime()===today?" is-today":"")+'"><span class="cal-dn">'+
      d.getUTCDate()+"</span>"+
      (evs.length
        ? '<span class="cal-dots" aria-hidden="true">'+evs.map(p =>
            '<span class="cal-dot '+evClass(p)+'"></span>').join("")+"</span>"+
          evs.map(p => '<button class="cal-ev '+evClass(p)+'" data-open="'+p.id+
            '" title="'+esc(p.title)+'">'+esc(p.title)+"</button>").join("")
        : "")+"</div>";
  }
  const list = mine.length
    ? '<div class="cal-list">'+mine.map(p => '<button class="cal-li" data-open="'+p.id+
        '"><span class="cal-li-d '+evClass(p)+'">'+
        esc(FMT_SHORT.format(parseISO(p.event_date)))+"</span>"+
        '<span class="cal-li-t">'+esc(p.title)+"</span></button>").join("")+"</div>"
    : '<p class="cal-empty">Nothing scheduled.</p>';
  return '<section class="cal-m">'+
    (withHead ? '<p class="cal-m-head"><span>'+esc(FMT_MON.format(m))+
      '</span><span class="n">'+mine.length+"</span></p>" : "")+
    '<div class="cal-grid">'+grid+"</div>"+list+"</section>";
}

function renderCalendar(){
  const start = calPeriod();
  const quarter = calSpan==="quarter";
  const months = quarter ? [0,1,2].map(i => shiftMonths(start,i)) : [start];
  const end = shiftMonths(start, months.length);

  const live = programs.filter(p => !p.archived);
  const shown = view.cat ? live.filter(p => (progCats[p.id]||[]).includes(view.cat)) : live;
  const byDate = {};
  shown.forEach(p => (byDate[p.event_date] = byDate[p.event_date] || []).push(p));
  Object.keys(byDate).forEach(k => byDate[k].sort((a,b) => a.title<b.title?-1:1));
  const inPeriod = shown.filter(p => {
    const d=parseISO(p.event_date); return d>=start && d<end; });

  const title = quarter
    ? "Q"+(Math.floor(start.getUTCMonth()/3)+1)+" "+start.getUTCFullYear()
    : FMT_MONTH.format(start);
  const span = (id,label) => '<button class="seg-b'+(calSpan===id?" is-on":"")+
    '" data-calspan="'+id+'" aria-pressed="'+(calSpan===id)+'">'+label+"</button>";

  return '<div class="cal-bar"><div class="cal-nav">'+
    '<button class="btn" data-calnav="-1" aria-label="Earlier">‹</button>'+
    '<button class="btn" data-calnav="0">Today</button>'+
    '<button class="btn" data-calnav="1" aria-label="Later">›</button></div>'+
    '<h2 class="cal-title">'+esc(title)+"</h2>"+
    '<span class="cal-sub">'+inPeriod.length+
      (inPeriod.length===1?" program":" programs")+"</span>"+
    '<span class="spacer"></span><div class="seg" role="group" aria-label="Calendar span">'+
    span("month","Month")+span("quarter","Quarter")+"</div></div>"+
    '<div class="cal-months'+(quarter?" is-q":"")+'">'+
    months.map(m => monthBlock(m, byDate, quarter)).join("")+"</div>"+
    '<div class="cal-legend"><span><i class="cal-key k-urgent"></i>Needs attention</span>'+
    '<span><i class="cal-key"></i>On track</span>'+
    '<span><i class="cal-key k-done"></i>Already run</span>'+
    (view.cat ? '<span>filtered to '+esc(catName(view.cat))+"</span>" : "")+"</div>";
}

function renderRunSheet(){
  const p = programs.find(x => x.id === view.id);
  if (!p) return chrome("");
  const items = runSheet[p.id] || [];
  const ev = parseISO(p.event_date);
  const days = diffDays(todayUTC(), ev);
  const doneN = items.filter(i => i.done).length;

  const when = days === 0 ? "Today" : days > 0 ? "In " + days + " days"
             : Math.abs(days) + " days ago";

  /* Who is on, how to say their name, and how to reach them if the
     connection drops — §6.2 asks for contact details to hand. */
  const people = p.program_speakers.length
    ? p.program_speakers.map(ps => {
        const s = ps.speakers || {};
        return '<div class="crew">' +
          '<div class="crew-name">' + esc(s.full_name) +
            (s.name_audio_at ? ' <button class="mini" data-hear="'+s.id+'">▸ hear</button>' : "") +
          "</div>" +
          (s.preferred_title ? '<div class="crew-bit">Introduce as: '+esc(s.preferred_title)+"</div>" : "") +
          (s.pronunciation ? '<div class="crew-bit">Say: <b>'+esc(s.pronunciation)+"</b></div>" : "") +
          (ps.topic ? '<div class="crew-bit">Topic: '+esc(ps.topic)+"</div>" : "") +
          '<div class="crew-bit">' +
            (s.phone ? '<a href="tel:'+esc(s.phone.replace(/[^0-9+]/g,""))+'">'+esc(s.phone)+"</a>" : "") +
            (s.phone && s.email ? " · " : "") +
            (s.email ? '<a href="mailto:'+esc(s.email)+'">'+esc(s.email)+"</a>" : "") +
          "</div></div>";
      }).join("")
    : '<p class="empty-note">No speakers on this program.</p>';

  const phases = RUN_PHASES.map(ph => {
    const rows = items.filter(i => i.phase === ph.id)
      .sort((a,b) => a.seq - b.seq)
      .map(i =>
        '<label class="run-step' + (i.done ? " is-done" : "") + '">' +
        '<input type="checkbox" data-run="'+i.id+'"'+(i.done?" checked":"")+">" +
        '<span class="run-text">'+esc(i.step)+
          '<span class="run-src">'+esc(i.source)+"</span>" +
          (i.done && i.done_by ? '<span class="run-by">'+esc(i.done_by.split("@")[0])+"</span>" : "") +
        "</span></label>").join("");
    if (!rows) return "";
    return '<section class="panel run-phase"><p class="panel-head"><span>'+esc(ph.label)+
      "</span><span>"+esc(ph.when)+"</span></p>"+rows+"</section>";
  }).join("");

  return chrome(
    '<button class="back" data-back>← All programs</button>' +
    '<div class="detail-head"><p class="d-date"><span>Run sheet · ' +
      esc(FMT_FULL.format(ev)) + " · 12:00–1:30 PT · " + esc(when) + "</span>" +
      '<button class="mini" data-open="'+p.id+'">Program page</button></p>' +
      "<h2>"+esc(p.title)+"</h2>" +
      '<p class="desc">' + doneN + " of " + items.length + " steps done" +
      (p.kind === "vendor"
        ? ' · <b style="color:var(--warn)">Sponsored program — disclose it at the top and offer no CLE</b>'
        : "") + "</p></div>" +
    '<section class="panel"><p class="panel-head"><span>On air</span>' +
      "<span>tap a number if someone drops</span></p>" + people + "</section>" +
    (items.length ? phases
      : '<section class="panel"><p class="sub" style="margin:0">Preparing the run sheet…</p></section>'));
}

        '<select data-sstatus="'+x.id+'" aria-label="Where it stands">' +

/* One thread open at a time: fifteen items with their discussions all
   unrolled is a page nobody scrolls. The count stays visible either way. */
function suggestionThread(x){
  const list = suggComments[x.id] || [], open = view.openSugg === x.id;
  const label = list.length
    ? list.length + (list.length === 1 ? " comment" : " comments")
    : "Add a comment";
  const head = '<button class="sc-toggle" data-scopen="' + x.id +
    '" aria-expanded="' + open + '"><span class="sc-caret" aria-hidden="true">' +
    "\u25b6</span>" + esc(label) + "</button>";
  if (!open) return '<div class="sc-foot">' + head + "</div>";

  const rows = list.map(c =>
    '<div class="sc-c"><p class="sc-who">' +
      esc(personLabel(c.author) || "someone") +
      '<span class="sc-when">' + esc(FMT_LOG.format(new Date(c.created_at))) + "</span>" +
      (isMine(c.author)
        ? '<button class="sc-del" data-scdel="' + c.id + '">Delete</button>' : "") +
    '</p><p class="sc-body">' + esc(c.body) + "</p></div>").join("");

  return '<div class="sc-foot">' + head + '<div class="sc-thread">' +
    (rows || '<p class="sc-none">Nothing yet. Say what you think.</p>') +
    '<div class="sc-add">' +
      '<textarea id="sc-body-' + x.id + '" rows="2" aria-label="Your comment" ' +
      'placeholder="What do you think?"></textarea>' +
      '<button class="btn primary" data-scadd="' + x.id + '">Post</button>' +
    "</div></div></div>";
}

/* Bulk assignment: programs down, roles across. The point is to set a whole
   season without opening each program one at a time, and to see the gaps. */
function renderAssign(){
  const live = assignable();
  if (!live.length)
    return chrome('<section class="panel"><p class="panel-head"><span>Assignments</span>'+
      "</p><div class=\"callout-note\">No upcoming programs. This screen covers live "+
      "programs that have not happened yet.</div></section>");

  const gaps = live.reduce((n,p) =>
    n + PROGRAM_ROLES.filter(r => !personFor(p.id, r.id)).length, 0);

  const head = '<tr><th class="n">Program</th>'+
    PROGRAM_ROLES.map(r =>
      "<th>"+esc(r.label)+
      '<select class="conf pp-all" data-ppall="'+r.id+
      '" aria-label="Set the '+esc(r.label)+' for every program below">'+

function renderSeason(){
  if (view.creating) return chrome(newProgramForm());
  if (view.tab==="assign") return renderAssign();
  if (view.tab==="team") return renderTeam();
  if (view.tab==="ideas") return renderIdeas();
  if (view.tab==="suggestions") return renderSuggestions();
  if (view.tab==="analytics") return renderAnalytics();
  if (view.tab==="runsheet") return renderRunSheet();
  if (view.tab==="roster") return view.speakerId ? renderSpeaker() : renderRoster();
  if (view.tab==="history") return chrome(historyPanel(null));

  const live = programs.filter(p => !p.archived);
  const shelf = programs.filter(p => p.archived);
  const upcoming = live.filter(p => !isPast(p)), past = live.filter(isPast);
  const list = view.tab==="upcoming" ? upcoming
             : view.tab==="past" ? past
             : view.tab==="catalog" ? shelf
             : live;
  const shown = view.cat ? list.filter(p => (progCats[p.id]||[]).includes(view.cat)) : list;

  const rows = upcoming.map(p=>{
    const a=alertsFor(p); if(!a.length) return "";
    return '<div class="alert"><span class="a-date">'+esc(FMT_SHORT.format(parseISO(p.event_date)))+
      '</span><span class="a-text"><b>'+esc(a.join(" · "))+"</b> — "+esc(p.title)+
      '</span><button class="a-go" data-open="'+p.id+'">Open →</button></div>';
  }).filter(Boolean);

  const roll = alertRollup(upcoming.filter(p => alertsFor(p).length));
  const alerts = rows.length
    ? '<section class="alerts"><button class="alerts-roll" id="alerts-roll" aria-expanded="'+
      alertsOpen+'" aria-controls="alerts-list">'+
      '<span class="ar-caret" aria-hidden="true">▶</span>'+
      '<span class="ar-head">Needs attention</span>'+
      '<span class="ar-count">'+rows.length+" of "+upcoming.length+
        " upcoming programs</span>"+
      '<span class="ar-chips">'+roll.map(t =>
        '<span class="ar-chip">'+esc(t)+"</span>").join("")+"</span></button>"+
      '<div class="alerts-list" id="alerts-list"'+(alertsOpen?"":" hidden")+">"+
      rows.join("")+"</div></section>"
    : "";

  const tab=(id,label,n)=>'<button class="tab" role="tab" data-tab="'+id+'" aria-selected="'+
    (view.tab===id)+'">'+label+'<span class="count">'+n+"</span></button>";

  const filter = categories.length
    ? '<div class="cat-filter">' + categories.map(c =>
        '<button class="chip-t'+(view.cat===c.id?" is-on":"")+'" data-catfilter="'+c.id+'">'+
        esc(c.name)+"</button>").join("") +
      (view.cat ? '<button class="chip-t" data-catfilter="">Clear</button>' : "") + "</div>"
    : "";

  /* Cards or calendar. The upcoming/completed tabs are a filter on a list and
     mean nothing against a calendar, whose period is its own filter, so in
     calendar mode the toggle stands in for them. */
  const lay = (id,label) => '<button class="seg-b'+(layout===id?" is-on":"")+
    '" data-layout="'+id+'" aria-pressed="'+(layout===id)+'">'+label+"</button>";
  const seg = '<div class="seg" role="group" aria-label="How to show the season">'+
    lay("cards","Cards")+lay("calendar","Calendar")+"</div>";
  const newBtn = '<button class="btn primary" id="new-program">+ New program</button>';

  if (layout==="calendar")
    return chrome(alerts + '<div class="tabs">'+seg+'<span class="spacer"></span>'+
      newBtn+"</div>" + filter + renderCalendar());

  return chrome(alerts + '<div class="tabs" role="tablist">' +
    tab("upcoming","Upcoming",upcoming.length)+tab("past","Completed",past.length)+
    tab("all","All",live.length)+tab("catalog","Catalogue",shelf.length)+
    '<span class="spacer"></span>'+seg+newBtn+"</div>" + filter +
    '<div class="grid">'+shown.map(card).join("")+"</div>");
}

function card(p){
  const d=parseISO(p.event_date), days=diffDays(todayUTC(),d);
  const past=days<0, late=lateCount(p), urgent=!past&&alertsFor(p).length>0;
  const daysTxt = past?Math.abs(days)+" days ago":(days===0?"Today":days+" days out");
  const sp = p.program_speakers.length
    ? p.program_speakers.map(ps=>'<span class="sp"><span class="sp-dot'+
        (ps.confirmation==="confirmed"?"":" un")+'"></span>'+
        esc((ps.speakers?.full_name||"").replace(/,\s*Esq\.$/,""))+"</span>").join("")
    : '<span class="sp-none">No speakers named</span>';
  const gates = GATE_LABELS.map(g=>'<div class="gate-c '+gateState(p,g.key)+
    '"><div class="gate-bar"></div><div class="gate-label">'+esc(g.label)+"</div></div>").join("");
  return '<button class="card'+(past?" is-past":"")+(urgent?" is-urgent":"")+'" data-open="'+p.id+
    '"><div class="card-top"><span class="card-date">'+esc(FMT_CARD.format(d))+
    '</span><span class="card-days'+(!past&&days<=35?" soon":"")+'">'+esc(daysTxt)+
    "</span></div><h3>"+esc(p.title)+"</h3>"+'<div class="speakers-line">'+sp+"</div>"+
    ((progCats[p.id]||[]).length
      ? '<div class="cat-tags">'+(progCats[p.id]||[]).map(id=>
          '<span class="cat-tag">'+esc(catName(id))+"</span>").join("")+"</div>"
      : "")+
    '<div class="gates">'+gates+'</div><div class="card-foot"><span>'+
    (p.archived ? (p.location ? esc(p.location) : "Catalogue")
      : past ? "Complete"
      : ((p.kind && p.kind!=="paid") ? esc(kindLabel(p.kind).split(" (")[0])
                                     : "12:00–1:30 PT"))+"</span>"+
    (late ? '<span class="late-n">'+late+" overdue</span>"
      : (!past && days<=1 && !p.archived
          ? '<span style="color:var(--accent);font-weight:600">Run sheet ready</span>'
          : "<span></span>"))+"</div></button>";
}

function renderDetail(){
  const p=programs.find(x=>x.id===view.id);
  if (!p) return chrome("");
  const d=parseISO(p.event_date), days=diffDays(todayUTC(),d), past=days<0;

  const head = view.edit ? editProgramForm(p) :
    '<div class="detail-head"><p class="d-date"><span>'+esc(FMT_FULL.format(d))+
    " · 12:00–1:30 PT · "+(past?Math.abs(days)+" days ago":(days===0?"Today":days+" days out"))+
    ((p.kind && p.kind!=="paid") ? " · "+esc(kindLabel(p.kind)) : "")+
    '</span><button class="mini" data-runsheet="'+p.id+'">Run sheet</button>'+
    '<button class="mini" id="edit-program">Edit program</button></p><h2>'+esc(p.title)+"</h2>"+
    (p.description ? '<p class="desc">'+esc(p.description)+"</p>"
      : '<p class="desc missing">No description on file — registration cannot open without one.</p>')+
    "</div>";

  /* speakers */
  const spRows = p.program_speakers.length ? p.program_speakers.map(ps=>{
    if (view.editSpeaker===ps.id) return editSpeakerForm(ps);
    const s=ps.speakers||{};
    const meta=[ps.topic,typeLabel(s.speaker_type),s.preferred_title,s.firm,s.email,
      s.pronunciation?"say: "+s.pronunciation:""].filter(Boolean).join(" · ");
    const lk=links[ps.id];
    const linkMeta = lk
      ? (lk.open_count ? "packet opened "+lk.open_count+"×, last "+
          FMT_LOG.format(new Date(lk.last_opened_at)) : "packet link sent — not opened yet")
      : "";
    const linkBtn = lk
      ? '<a class="mini" href="'+esc(speakerUrl(lk.token))+'" target="_blank" rel="noopener">Preview packet</a>'+
        '<button class="mini" data-copylink="'+esc(lk.token)+'">Copy link</button>'+
        '<button class="mini" data-email="'+ps.id+'">Copy email</button>'+
        '<button class="mini" data-emailprev="'+ps.id+'">Preview email</button>'
      : '<button class="mini" data-newlink="'+ps.id+'">Create packet link</button>';
    return '<div class="sp-row"><div><div class="sp-name">'+esc(s.full_name)+
      (s.name_audio_at ? ' <button class="mini" data-hear="'+s.id+
        '" title="Hear them say their name">▸ hear</button>' : "")+"</div>"+
      (meta?'<div class="sp-meta">'+esc(meta)+"</div>":"")+
      (linkMeta?'<div class="sp-meta" style="color:var(--accent)">'+esc(linkMeta)+"</div>":"")+
      "</div>"+
      '<div class="sp-actions"><select class="conf" data-conf="'+ps.id+'">'+
      CONFIRMATIONS.map(c=>'<option value="'+c+'"'+(ps.confirmation===c?" selected":"")+">"+c+"</option>").join("")+
      "</select>"+linkBtn+
      '<button class="mini" data-editsp="'+ps.id+'">Edit</button>'+
      '<button class="mini danger" data-rmsp="'+ps.id+'" data-name="'+esc(s.full_name)+'">Remove</button>'+
      "</div></div>";
  }).join("") : '<p class="empty-note">No speakers named. Every downstream deadline — agreement, bio, headshot, outline, marketing — depends on this.</p>';

  const addRow = '<div class="add-row"><div class="field">'+
    '<label class="field-label" for="add-sp">Add speaker</label>'+
    '<input type="text" id="add-sp" list="roster-list" placeholder="Type a name — existing or new">'+
    '<datalist id="roster-list">'+roster.map(r=>'<option value="'+esc(r.full_name)+'"></option>').join("")+
    "</datalist></div>"+
    '<button class="btn" id="add-sp-btn" data-program="'+p.id+'">Add</button></div>';

  const speakersPanel='<section class="panel"><p class="panel-head"><span>Speakers</span><span>'+
    p.program_speakers.length+" on record</span></p>"+spRows+addRow+
    (p.note?'<div class="note-row">'+esc(p.note)+"</div>":"")+"</section>";

  /* package */
  let pkgPanel="";
  if (p.program_speakers.length){
    const rows=p.program_speakers.map(ps=>'<tr><td class="n">'+esc(ps.speakers?.full_name||"")+"</td>"+
      PACKAGE_ITEMS.map(it=>{
        const dl=(ps.deliverables||[]).find(x=>x.item===it.id);
        if (!dl) return "<td>—</td>";
        return '<td><input type="checkbox" data-deliv="'+dl.id+'"'+(dl.received?" checked":"")+
          ' aria-label="'+esc((ps.speakers?.full_name||"")+" "+it.label)+'"></td>';
      }).join("")+"</tr>").join("");
    pkgPanel='<section class="panel"><p class="panel-head"><span>Speaker package · §2.1</span>'+
      '<span>due T−21</span></p><div class="pk-scroll"><table class="pk"><thead><tr><th class="n">Speaker</th>'+
      PACKAGE_ITEMS.map(it=>"<th>"+esc(it.label)+"</th>").join("")+
      "</tr></thead><tbody>"+rows+"</tbody></table></div></section>";
  }

  /* docket */
  const dkRows=p.tasks.map(t=>{
    const st=taskStatus(p,t), due=addDays(parseISO(p.event_date),t.offset_days);
    return '<tr class="'+st+'"><td class="c-check"><input type="checkbox" data-task="'+t.id+'"'+
      (t.done?" checked":"")+' aria-label="'+esc(t.task)+'"></td><td class="c-off">'+
      offLabel(t.offset_days)+'</td><td class="c-date">'+esc(FMT_SHORT.format(due))+
      '</td><td class="c-task">'+esc(t.task)+(t.is_gate?'<span class="gate-mark">▪ gate</span>':"")+
      '</td><td class="c-owner">'+esc(t.owner_role)+'</td>'+
      '<td class="c-assign">'+assignCell(t)+'</td><td class="c-src">'+esc(t.source_ref)+
      '</td><td class="c-by">'+esc(personLabel(t.done_by))+"</td></tr>";
  }).join("");
  const catPanel = categories.length
    ? '<section class="panel"><p class="panel-head"><span>Categories</span>' +
      '<span>click to tag</span></p>' +
      catChips("program", p.id, progCats[p.id] || []) + "</section>"
    : "";

  /* post-event statistics */
  const m = metrics[p.id], dv = derive(m);
  const statsPanel = view.editStats
    ? statsForm(p, m)
    : '<section class="panel"><p class="panel-head"><span>Statistics · §3.2</span>' +
      '<button class="mini" id="st-edit">' + (m ? "Edit" : "Record them") + "</button></p>" +
      (m
        ? '<div class="stats">' + [
            ["Registrations", show(m.registrations_total)],
            ["Members", show(m.registrations_member)],
            ["Non-members", show(m.registrations_nonmember)],
            ["Live attendees", show(m.live_attendees)],
            ["Attendance rate", pct(dv.attendance)],
            ["Gross revenue", money(m.gross_revenue)],
            ["Per attendee", money(dv.perHead)],
            ["Survey", m.survey_score ? m.survey_score + " / 5 (" + show(m.survey_responses) + ")" : "—"],
            ["Non-members joined", show(m.nonmember_joined)],
            ["Conversion", pct(dv.conversion)]
          ].map(([k,v]) => '<div class="stat"><span class="stat-k">'+esc(k)+
            '</span><span class="stat-v">'+esc(v)+"</span></div>").join("") + "</div>" +
          (m.tech_issues ? '<p class="note-row">Technical problems: '+esc(m.tech_issues)+"</p>" : "") +
          (m.notes ? '<p class="sub" style="margin:.6rem 0 0">'+esc(m.notes)+"</p>" : "") +
          '<p class="sub" style="margin:.6rem 0 0;font-size:.82rem;color:var(--faint)">Recorded by ' +
            esc((m.recorded_by||"").split("@")[0]) + "</p>"
        : '<p class="sub" style="margin:0">Nothing recorded yet. §3.2 asks for these before ' +
          "the debrief goes to the EMC Chair.</p>") +
      "</section>";

  /* what speakers have sent in */
  const inbox = p.program_speakers.flatMap(ps =>
    (uploads[ps.id]||[]).map(u => ({ ...u, who: ps.speakers?.full_name || "" })));
  const inboxPanel = inbox.length
    ? '<section class="panel"><p class="panel-head"><span>Sent in by speakers</span><span>'+
      inbox.length + (inbox.length===1?" file":" files") + '</span></p>'+
      inbox.map(u =>
        '<div class="sp-row"><div><div class="sp-name">'+esc(u.filename)+'</div>'+
        '<div class="sp-meta">'+esc(u.who)+' · '+esc(u.kind)+' · '+esc(kb(u.size_bytes))+
        ' · '+esc(FMT_LOG.format(new Date(u.uploaded_at)))+'</div></div>'+
        '<button class="mini" data-dl="'+esc(u.id)+'" data-fn="'+esc(u.filename)+
        '">Download</button></div>').join("")+'</section>'
    : "";

  const mineOpen = myEmail
    ? p.tasks.filter(t=>!t.done && (t.assignee_email||"").toLowerCase()===myEmail).length
    : 0;
  const docket='<section class="panel"><p class="panel-head"><span>Docket</span><span>'+
    (mineOpen ? mineOpen+" open for you · " : "")+
    p.tasks.filter(t=>t.done).length+" of "+p.tasks.length+" complete</span></p>"+
    '<div class="dk-scroll"><table class="dk"><thead><tr><th></th><th>Offset</th><th>Date</th>'+
    "<th>Task</th><th>Owner</th><th>Assigned to</th><th>Source</th><th>By</th></tr></thead><tbody>"+dkRows+
    "</tbody></table></div></section>";

  return chrome('<button class="back" data-back>← All programs</button>'+head+
    catPanel+speakersPanel+pkgPanel+inboxPanel+statsPanel+docket+historyPanel(p.id));
}

    if (h.field==="added")        what='<span class="f">Added</span> '+esc(h.new_value||h.label);
    else if (h.field==="removed") what='<span class="f">Removed</span> '+esc(h.old_value||h.label);
    else what = esc(h.label)+' — <span class="f">'+esc(f)+"</span> "+
      (h.old_value?'<span class="old">'+esc(trunc(h.old_value))+"</span> → ":"set to ")+
      esc(trunc(h.new_value)||"empty");
    return '<div class="hist-item"><span class="hist-when">'+
      esc(FMT_LOG.format(new Date(h.changed_at)))+'</span><div><div class="hist-what">'+what+
      '</div><div class="hist-who">'+esc((h.changed_by||"").split("@")[0])+"</div></div></div>";
  }).join("") : '<p class="hist-empty">No changes recorded yet.</p>';

  return '<section class="panel"><p class="panel-head"><span>Change history</span><span>'+
    (programId?"this program":"everything")+"</span></p>"+
    '<div class="hist">'+items+"</div></section>";
}
const trunc = s => { s=String(s??""); return s.length>70 ? s.slice(0,70)+"…" : s; };

/* ================= saving ================= */
let toastEl=null;
function toast(text,isErr){
  if(!toastEl){ toastEl=document.createElement("div"); document.body.appendChild(toastEl); }
  toastEl.className="saving"+(isErr?" err":""); toastEl.textContent=text;
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>{ toastEl?.remove(); toastEl=null; }, isErr?7000:1400);
}

async function mutate(fn, okMsg){
  if (busy) return;
  busy=true; toast("Saving…");
  try {
    const { error } = await fn();
    if (error) throw error;
    await loadData();
    if (view.name==="detail") await loadHistory(view.id);
    else if (view.tab==="history") await loadHistory(null);
    toast(okMsg||"Saved");
  } catch(e){
    toast("Not saved — "+(e.message||e), true);
  } finally { busy=false; render(); }
}

const setTask  = (id,done)     => mutate(()=>sb.from("tasks").update({done}).eq("id",id));
const setDeliv = (id,received) => mutate(()=>sb.from("deliverables")
  .update({received, received_on: received ? new Date().toISOString().slice(0,10) : null}).eq("id",id));
const setConf  = (id,confirmation) => mutate(()=>sb.from("program_speakers")
  .update({confirmation, confirmed_on: confirmation==="confirmed" ? new Date().toISOString().slice(0,10) : null})
  .eq("id",id));
const removeSpeaker = id => mutate(()=>sb.from("program_speakers").delete().eq("id",id), "Speaker removed");

function slugFor(date,title){
  const base = date+"-"+String(title).toLowerCase().replace(/[^a-z0-9]+/g,"-")
    .replace(/^-|-$/g,"").split("-").filter(Boolean).slice(0,4).join("-");
  const taken = new Set(programs.map(p=>p.slug));
  if (!taken.has(base)) return base;
  let i=2; while (taken.has(base+"-"+i)) i++;
  return base+"-"+i;
}

async function createProgram(){
  const date=val("np-date"), title=val("np-title");
  if (!date || !title) { toast("Date and title are both required", true); return; }
  await mutate(()=>sb.from("programs").insert({
    slug: slugFor(date,title), event_date: date, title,
    kind: val("np-kind") || "paid",
    description: val("np-desc"), note: val("np-note"),
    venue: val("np-venue"), location: val("np-loc"), store_url: val("np-store"),
    archived: !!document.getElementById("np-archived")?.checked
  }), document.getElementById("np-archived")?.checked
       ? "Added to the catalogue" : "Program created with its docket");
  view = { ...view, creating:false, tab:"upcoming" };
  render();
}

async function saveProgram(id){
  const date=val("ep-date"), title=val("ep-title");
  if (!date || !title) { toast("Date and title are both required", true); return; }
  view.edit=false;
  await mutate(async ()=>{
    const a = await sb.from("programs").update({
      event_date: date, title, kind: val("ep-kind") || "paid",
      description: val("ep-desc"), note: val("ep-note"),
      venue: val("ep-venue"), location: val("ep-loc"),
      store_url: val("ep-store"), recording_url: val("ep-rec"),
      archived: !!document.getElementById("ep-archived")?.checked
    }).eq("id",id);
    if (a.error) return a;
    return await sb.from("program_people").upsert(
      PROGRAM_ROLES.map(r => ({ program_id:id, role:r.id, email: val("ep-pp-"+r.id) })),
      { onConflict: "program_id,role" });
  });
}

async function saveSpeaker(speakerId, psId){
  const name=val("es-name");
  if (!name) { toast("Name cannot be empty", true); return; }
  const topic=val("es-topic");
  view.editSpeaker=null;
  await mutate(async ()=>{
    const a = await sb.from("speakers").update({
      full_name:name, preferred_title:val("es-title"), firm:val("es-firm"),
      email:val("es-email"), phone:val("es-phone"), address:val("es-addr"),
      pronunciation:val("es-say"),
      speaker_type: val("es-type") || null,
      headshot_location:val("es-head"), bio_location:val("es-bio")
    }).eq("id", speakerId);
    if (a.error) return a;
    return await sb.from("program_speakers").update({ topic }).eq("id", psId);
  });
}

async function addSpeaker(programId){
  const name=val("add-sp");
  if (!name) { toast("Type a name first", true); return; }
  const p = programs.find(x=>x.id===programId);
  if (p.program_speakers.some(ps=>(ps.speakers?.full_name||"").toLowerCase()===name.toLowerCase())){
    toast(name+" is already on this program", true); return;
  }
  await mutate(async ()=>{
    let hit = roster.find(r=>r.full_name.toLowerCase()===name.toLowerCase());
    if (!hit){
      const ins = await sb.from("speakers").insert({ full_name:name }).select("id, full_name").single();
      if (ins.error) return ins;
      hit = ins.data;
    }
    return await sb.from("program_speakers").insert({
      program_id: programId, speaker_id: hit.id,
      confirmation: "invited", sort_order: p.program_speakers.length
    });
  }, "Speaker added with package items");
}

/* ================= boot ================= */
async function boot(){
  const { data } = await sb.auth.getSession();
  session=data.session;
  if (!session) { renderGate(); return; }
  try {
    await loadData();
    if (!programs.length){
      app.innerHTML='<div class="gate"><p class="eyebrow">Signed in as '+esc(session.user.email)+
        '</p><h1>No access yet</h1><p>You are signed in, but this address is not on the '+
        "Education Committee list, so there is nothing to show. Ask an administrator to add it.</p>"+
        '<button class="btn" id="so2">Sign out</button></div>';
      document.getElementById("so2").addEventListener("click", async ()=>{
        await sb.auth.signOut(); session=null; renderGate(); });
      return;
    }
    render();
  } catch(e){
    app.innerHTML='<div class="gate"><h1>Could not load</h1><div class="msg err">'+
      esc(e.message||String(e))+"</div></div>";
  }
}

sb.auth.onAuthStateChange(ev=>{
  if ((ev==="SIGNED_IN"||ev==="TOKEN_REFRESHED") && !session) boot();
});
window.addEventListener("unhandledrejection", ev => {
  const m = ev.reason?.message || String(ev.reason || "");
  if (m) toast("Something failed: " + m, true);
});

boot();
