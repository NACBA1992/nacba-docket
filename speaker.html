<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="assets/favicon.png">
<meta name="theme-color" content="#0B243A">
<title>NACBA Speaker Packet</title>
<style>
  :root{
    --ground:#F0F3F6; --surface:#FFF; --surface-2:#F6F8FA;
    --ink:#0B243A; --muted:#52657A; --faint:#8497A9;
    --accent:#1D6091; --brand:#4F98CA; --accent-soft:#E4F0F9;
    --critical:#9E2A33; --critical-soft:#F8E9EA;
    --warn:#8A6210; --warn-soft:#F8F0DE;
    --ok:#2A6650; --ok-soft:#E3F0EA;
    --rule:#D9E0E7; --rule-strong:#BECAD5;
    --shadow:0 1px 2px rgba(11,36,58,.06);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ground:#0A1621; --surface:#0F2130; --surface-2:#152B3C;
    --ink:#E4EDF4; --muted:#9BB0C2; --faint:#7A8FA1;
    --accent:#7FB6DC; --brand:#4F98CA; --accent-soft:#123048;
    --critical:#E58B90; --critical-soft:#3A1E21;
    --warn:#D6AB5C; --warn-soft:#332815;
    --ok:#6FBF9C; --ok-soft:#15302A;
    --rule:#22384A; --rule-strong:#334C60;
    --shadow:0 1px 2px rgba(0,0,0,.35);
  }}
  :root[data-theme="dark"]{
    --ground:#0A1621; --surface:#0F2130; --surface-2:#152B3C;
    --ink:#E4EDF4; --muted:#9BB0C2; --faint:#7A8FA1;
    --accent:#7FB6DC; --brand:#4F98CA; --accent-soft:#123048;
    --critical:#E58B90; --critical-soft:#3A1E21;
    --warn:#D6AB5C; --warn-soft:#332815;
    --ok:#6FBF9C; --ok-soft:#15302A;
    --rule:#22384A; --rule-strong:#334C60;
    --shadow:0 1px 2px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{background:var(--ground);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:17px;line-height:1.65;margin:0;padding:0 1.25rem 5rem;-webkit-font-smoothing:antialiased}
  .wrap{max-width:60rem;margin:0 auto}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 18.5rem;gap:2.25rem;align-items:start}
  .side{position:sticky;top:1.25rem;display:flex;flex-direction:column;gap:1.5rem}
  .side section{margin:0}
  .side h2{font-size:.95rem}
  @media (max-width:54rem){
    .layout{grid-template-columns:1fr;gap:0}
    .side{position:static}
  }
  /* One typeface throughout. Digits align via tabular-nums rather than by
     setting dates in a monospace face, which read as code on a page speakers
     are meant to sit and read. */
  .when,.dl-date,.up-meta{font-variant-numeric:tabular-nums}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .logo-plate{display:inline-block;background:#FFF;padding:.4rem .55rem;border-radius:3px;
    line-height:0;margin:0 0 1rem;border:1px solid var(--brand)}
  .logo-plate img{display:block;width:190px;height:auto}

  header{padding:3rem 0 1.75rem;border-bottom:2px solid var(--ink);margin-bottom:2rem}
  .eyebrow{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:0 0 .6rem}
  h1{font-size:clamp(1.7rem,5vw,2.3rem);line-height:1.12;letter-spacing:-.018em;
    font-weight:600;margin:0 0 .7rem;text-wrap:balance}
  .when{font-size:.8rem;letter-spacing:.05em;color:var(--muted);margin:0}
  .greet{font-size:1.05rem;color:var(--muted);margin:1.5rem 0 0}
  .greet b{color:var(--ink);font-weight:600}

  section{margin-bottom:2rem}
  h2{font-size:1.15rem;font-weight:600;margin:0 0 .3rem;letter-spacing:-.008em}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 1rem}

  .panel{background:var(--surface);border:1px solid var(--rule);border-radius:4px;
    padding:1.1rem 1.2rem;box-shadow:var(--shadow)}

  /* deadline list */
  .dl{display:flex;flex-direction:column}
  .dl-item{display:grid;grid-template-columns:auto 1fr auto;gap:.25rem .9rem;
    padding:.8rem 0;border-top:1px solid var(--rule);align-items:center}
  .dl-item:first-child{border-top:none;padding-top:0}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--rule-strong);grid-row:span 2}
  .dl-item.done .dot{background:var(--ok)}
  .dl-item.late .dot{background:var(--critical)}
  .dl-item.soon .dot{background:var(--warn)}
  .dl-name{font-weight:600;font-size:1.02rem}
  .dl-note{grid-column:2;font-size:.91rem;color:var(--muted);line-height:1.55}
  .dl-date{font-size:.84rem;white-space:nowrap;
    color:var(--muted);text-align:right;grid-row:span 2}
  .dl-item.late .dl-date{color:var(--critical);font-weight:600}
  .dl-item.soon .dl-date{color:var(--warn);font-weight:600}
  .dl-item.done .dl-date{color:var(--ok)}
  .status{font-size:.65rem;letter-spacing:.06em;text-transform:uppercase;
    padding:.18rem .42rem;border-radius:2px;margin-left:.5rem;white-space:nowrap}
  .st-ok{background:var(--ok-soft);color:var(--ok)}
  .st-wait{background:var(--surface-2);color:var(--faint);border:1px solid var(--rule)}


  .callout{background:var(--accent-soft);border-left:3px solid var(--brand);
    border-radius:0 4px 4px 0;padding:1rem 1.15rem;margin:1.25rem 0}
  .callout.warn{background:var(--warn-soft);border-left-color:var(--warn)}
  .callout .label{display:block;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;
    color:var(--accent);margin-bottom:.4rem}
  .callout.warn .label{color:var(--warn)}
  .callout p{margin:0 0 .5rem;font-size:.93rem}
  .callout p:last-child{margin-bottom:0}

  .kv{display:grid;grid-template-columns:auto 1fr;gap:.45rem 1rem;font-size:.93rem}
  .kv dt{font-size:.82rem;color:var(--faint);padding-top:.05rem}
  .kv dd{margin:0}

  footer{margin-top:3rem;padding-top:1.25rem;border-top:2px solid var(--ink)}
  .foot{font-size:.8rem;color:var(--faint);line-height:1.7}
  .foot a{color:var(--accent)}

  .dl-item.sent .dot{background:var(--brand)}
  .st-sent{background:var(--accent-soft);color:var(--accent)}
  .inline-tpl,.inline-up{font-size:.86rem;color:var(--accent);text-decoration:none;white-space:nowrap;
    background:none;border:none;padding:0 0 0 .5rem;cursor:pointer}
  .inline-tpl:hover,.inline-up:hover{text-decoration:underline}

  /* co-panelists */
  .co-row{padding:.7rem 0;border-top:1px solid var(--rule)}
  .co-row:first-child{border-top:none;padding-top:0}
  .co-name{font-weight:600;font-size:.98rem}
  .co-meta{font-size:.87rem;color:var(--muted);margin-top:.1rem;word-break:break-word}
  .co-meta a{color:var(--accent)}

  /* uploads */
  .up-form{display:grid;gap:.45rem}
  .up-label{font-size:.82rem;font-weight:600;color:var(--muted);margin-top:.5rem}
  .up-form textarea,.bio-form textarea,.bio-form input[type=text]{font:inherit;font-size:.92rem;
    padding:.55rem .65rem;border:1px solid var(--rule-strong);border-radius:8px;
    background:var(--surface);color:inherit;width:100%;box-sizing:border-box;resize:vertical}
  .bio-form{display:grid;gap:.45rem}
  .bio-form textarea{line-height:1.5}
  .bio-count{font-size:.74rem;color:var(--faint);margin:.1rem 0 .3rem;text-align:right}
  .bio-count.over{color:var(--critical)}
  .bio-stamp{font-size:.78rem;color:var(--faint);margin:.5rem 0 0}
  .bio-shot{display:flex;align-items:center;gap:.8rem;margin-top:.4rem}
  .bio-shot img{width:72px;height:72px;border-radius:8px;object-fit:cover;
    border:1px solid var(--rule-strong)}
  .up-form select,.up-form input[type=file]{font:inherit;font-size:.92rem;padding:.5rem .6rem;
    border:1px solid var(--rule-strong);border-radius:3px;background:var(--surface-2);
    color:var(--ink);width:100%}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#FFF;margin-top:.7rem;
    justify-self:start;padding:.55rem 1rem}
  .btn.primary:disabled{opacity:.55;cursor:default}
  .up-status{font-size:.87rem;margin:.6rem 0 0;min-height:1.2em;color:var(--muted)}
  .up-status.ok{color:var(--ok)}
  .up-status.err{color:var(--critical)}
  .up-sent{margin-top:1.2rem;padding-top:1rem;border-top:1px solid var(--rule)}
  .up-head{font-size:.82rem;font-weight:600;color:var(--muted);margin:0 0 .6rem}
  .up-row{display:grid;grid-template-columns:auto 1fr auto;gap:.2rem .8rem;padding:.45rem 0;
    border-top:1px solid var(--rule);align-items:baseline;font-size:.88rem}
  .up-row:first-child{border-top:none;padding-top:0}
  .up-kind{font-size:.66rem;letter-spacing:.04em;
    text-transform:uppercase;color:var(--accent);background:var(--accent-soft);
    padding:.2rem .4rem;border-radius:2px;white-space:nowrap}
  .up-file{word-break:break-word}
  .up-meta{font-size:.7rem;color:var(--faint);
    white-space:nowrap;text-align:right}
  .up-empty{color:var(--faint);font-size:.9rem;margin:0}

  /* pop-outs: what each item actually involves, folded away until asked for */
  details.more{grid-column:2;margin:.45rem 0 0}
  details.more>summary{list-style:none;cursor:pointer;display:inline-block;
    font-size:.86rem;font-weight:600;
    color:var(--accent);padding:.1rem 0}
  details.more>summary::-webkit-details-marker{display:none}
  details.more>summary::before{content:"+ ";font-weight:700}
  details.more[open]>summary::before{content:"– "}
  details.more>summary:hover{text-decoration:underline}
  .more-body{margin:.55rem 0 .3rem;padding:.8rem .95rem;background:var(--surface-2);
    border:1px solid var(--rule);border-left:2px solid var(--brand);border-radius:0 3px 3px 0}
  .more-body p{margin:0 0 .65rem;font-size:.95rem;line-height:1.62}
  .more-body p:last-child{margin-bottom:0}
  .more-body ul{margin:0 0 .6rem;padding-left:1.1rem}
  .more-body ul:last-child{margin-bottom:0}
  .more-body li{margin-bottom:.4rem;font-size:.95rem;line-height:1.58}
  .more-body a{color:var(--accent)}

  /* say-my-name recorder */
  .rec{margin-top:.9rem;padding-top:.85rem;border-top:1px solid var(--rule)}
  .rec-head{font-size:.82rem;font-weight:600;color:var(--muted);margin:0 0 .5rem}
  .rec-row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
  .rec-btn{background:var(--surface);border:1px solid var(--rule-strong);border-radius:100px;
    padding:.45rem .95rem;font-size:.88rem;font-weight:600;color:var(--accent);cursor:pointer;
    display:inline-flex;align-items:center;gap:.45rem}
  .rec-btn:hover{border-color:var(--accent)}
  .rec-btn[disabled]{opacity:.5;cursor:default}
  .rec-btn.on{background:var(--critical);border-color:var(--critical);color:#fff}
  .rec-dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
  .rec-btn.on .rec-dot{animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.rec-btn.on .rec-dot{animation:none}}
  .rec-status{font-size:.86rem;color:var(--muted)}
  .rec-status.ok{color:var(--ok)} .rec-status.err{color:var(--critical)}
  .rec-file{font-size:.82rem;color:var(--faint)}
  .rec-file input{font-size:.82rem;max-width:15rem}
  audio{height:34px;max-width:100%}

  ul.plain{margin:0;padding-left:1.15rem}
  ul.plain li{margin-bottom:.5rem;font-size:.93rem}
  ul.plain li:last-child{margin-bottom:0}
  .panel .fine{font-size:.85rem;color:var(--muted);margin:.9rem 0 0;
    padding-top:.8rem;border-top:1px solid var(--rule)}
  .panel p{margin:0 0 .8rem;font-size:.93rem}

  .actions{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;margin:2.5rem 0 0}
  .btn{background:var(--surface);border:1px solid var(--rule-strong);border-radius:3px;
    padding:.55rem .95rem;font-size:.88rem;font-weight:600;color:var(--accent);cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .hint{font-size:.85rem;color:var(--muted)}
  .printed{color:var(--faint)}

  .center{max-width:30rem;margin:0 auto;padding:6rem 0;text-align:center}
  .center h1{margin-bottom:.8rem}
  .center p{color:var(--muted)}

  /* ---- printed / saved as PDF ----
     Forced to the light palette: a speaker on a dark-mode laptop should not
     get a black page. Tokens are restated rather than inherited. */
  @media print{
    :root{
      --ground:#FFF; --surface:#FFF; --surface-2:#FAFAFA;
      --ink:#0B243A; --muted:#41505F; --faint:#6B7B8A;
      --accent:#1D6091; --brand:#4F98CA; --accent-soft:#EEF5FA;
      --critical:#8E252E; --critical-soft:#FBF2F3;
      --warn:#7A5610; --warn-soft:#FBF6EA;
      --ok:#245A46; --ok-soft:#EFF6F2;
      --rule:#D0D8DF; --rule-strong:#AEBBC6; --shadow:none;
    }
    @page{margin:14mm}
    body{background:#FFF;font-size:10.5pt;padding:0}
    .wrap{max-width:none}
    .actions,.inline-up,#upload .up-form{display:none}
    .layout{display:block}
    .side{position:static;display:block;margin-top:1rem}
    details.more>summary{display:none}
    .more-body{background:none;border:none;border-left:2px solid #AEBBC6;
      padding:.2rem 0 .2rem .7rem}

    /* Only ever protect a block SHORTER than a page. A tall block told not to
       break is pushed whole to the next page, leaving the rest of the current
       one blank — which is how a two-page document printed as four. */
    section,.panel,.dl,.more-body{page-break-inside:auto}
    .dl-item,.co-row,.up-row,.callout{page-break-inside:avoid}
    h1,h2{page-break-after:avoid}
    header{padding-top:0}
    h1{font-size:19pt}
    h2{font-size:12.5pt}
    p,li{orphans:3;widows:3}
    section{margin-bottom:1.1rem}
    footer{page-break-inside:avoid}
    a{text-decoration:none;color:inherit}
  }

  @media (max-width:34rem){
    body{padding:0 1rem 4rem}
    header{padding-top:2rem}
    .dl-item{grid-template-columns:auto 1fr;gap:.2rem .7rem}
    .dl-date{grid-column:2;grid-row:auto;text-align:left}
    .dl-note{grid-column:2}
  }
</style>
</head>

function notFound(msg) {
  app.innerHTML = '<div class="center">' + brand() +
    "<h1>Link not recognized</h1><p>" + esc(msg) +
    "</p><p>Please ask your NACBA program coordinator to send you a new one, " +
    'or email <a href="mailto:admin@nacba.com">admin@nacba.com</a>.</p></div>';
}

function render(d) {
  const ev = parseISO(d.program.event_date);
  const today = todayUTC();
  const days = diffDays(today, ev);
  const recv = Object.fromEntries((d.deliverables||[]).map(x => [x.item, x]));

  /* deadlines, in date order */
  const rows = MILESTONES
    .map(m => ({ ...m, due: addDays(ev, m.off) }))
    .sort((a,b) => a.due - b.due || a.off - b.off)
    .map(m => {
      const done = m.items.length > 0 && m.items.every(i => recv[i]?.received);
      const sent = !done && m.up && (d.uploads||[]).some(u => u.kind === m.up);
      const overdue = !done && !sent && m.due < today && m.items.length > 0;
      const soon = !done && !overdue && diffDays(today, m.due) <= 7 && m.due >= today;
      const cls = done ? "done" : (sent ? "sent" : (overdue ? "late" : (soon ? "soon" : "")));
      const badge = m.items.length
        ? (done ? '<span class="status st-ok">received</span>'
          : sent ? '<span class="status st-sent">you sent this</span>'
                 : '<span class="status st-wait">awaiting</span>')
        : "";
      const rel = m.due < today
        ? Math.abs(diffDays(today, m.due)) + " days ago"
        : (diffDays(today, m.due) === 0 ? "today" : "in " + diffDays(today, m.due) + " days");
      const tpl = m.href
        ? ' <a class="inline-tpl" href="' + esc(m.href) + "?k=" + encodeURIComponent(tok) +
          '">' + esc(m.tplLabel) + " →</a>"
        : (m.tpl
          ? ' <a class="inline-tpl" href="templates/' + encodeURIComponent(m.tpl) +
            '" download>↓ ' + esc(m.tplLabel) + "</a>" : "");
      const up = m.up
        ? ' <button class="inline-up" data-jump="' + esc(m.up) + '">↑ Upload</button>' : "";
      const more = m.detail
        ? '<details class="more"><summary>What this involves</summary>' +
          '<div class="more-body">' + m.detail + "</div></details>" : "";
      return '<div class="dl-item ' + cls + '"><span class="dot"></span>' +
        '<span class="dl-name">' + esc(m.name) + badge + "</span>" +
        '<span class="dl-date">' + esc(FMT_DATE.format(m.due)) + "<br>" + esc(rel) + "</span>" +
        '<span class="dl-note">' + esc(m.note) + tpl + up + "</span>" + more + "</div>";
    }).join("");

  /* co-panelists */
  const co = (d.co_speakers || []);
  const coPanel = co.length
    ? "<section><h2>Your co-panelists</h2>" +
      '<p class="sub">Reach out directly to plan the session — NACBA does not ' +
      "schedule your planning call.</p><div class=\"panel\">" +
      co.map(c => {
        const bits = [c.preferred_title, c.firm].filter(Boolean).join(" · ");
        const contact = [
          c.email ? '<a href="mailto:' + esc(c.email) + '">' + esc(c.email) + "</a>" : "",
          c.phone ? esc(c.phone) : ""
        ].filter(Boolean).join(" · ");
        return '<div class="co-row"><div><div class="co-name">' + esc(c.full_name) +
          (c.confirmed ? "" : '<span class="status st-wait">not yet confirmed</span>') + "</div>" +
          (bits ? '<div class="co-meta">' + esc(bits) + "</div>" : "") +
          (c.topic ? '<div class="co-meta">Topic: ' + esc(c.topic) + "</div>" : "") +
          (contact ? '<div class="co-meta">' + contact + "</div>" : "") +
          "</div></div>";
      }).join("") + "</div></section>"
    : "";

  /* uploads */
  const mine = d.uploads || [];
  const kindLabel = k => (UPLOAD_KINDS.find(x => x.id === k) || {}).label || k;
  const sentList = mine.length
    ? mine.map(u => '<div class="up-row"><span class="up-kind">' + esc(kindLabel(u.kind)) +
        '</span><span class="up-file">' + esc(u.filename) + '</span>' +
        '<span class="up-meta">' + esc(kb(u.size_bytes)) + " · " +
        esc(FMT_DATE.format(new Date(u.uploaded_at))) + "</span></div>").join("")
    : '<p class="up-empty">Nothing sent yet.</p>';

  const nacbaPanel =
    "<section><h2>What NACBA will do</h2><div class=\"panel\"><ul class=\"plain\">" +
    "<li>Promote the program to our membership, including your name, headshot, and firm.</li>" +
    "<li>Send you branded “I am speaking at NACBA” graphics and post copy at least two " +
    "weeks out, for your own social media.</li>" +
    "<li>Run a technology check with you beforehand.</li>" +
    "<li>Record the session and make it available in the NACBA store.</li>" +
    "</ul></div></section>";

  const detailsPanel =
    "<section><h2>Details we hold for you</h2><div class=\"panel\"><dl class=\"kv\">" +
    "<dt>Name</dt><dd>" + esc(d.speaker.full_name) + "</dd>" +
    (d.speaker.preferred_title ? "<dt>Title</dt><dd>" + esc(d.speaker.preferred_title) + "</dd>" : "") +
    (d.speaker.firm ? "<dt>Firm</dt><dd>" + esc(d.speaker.firm) + "</dd>" : "") +
    (d.speaker.address ? "<dt>Address</dt><dd>" + esc(d.speaker.address) + "</dd>" : "") +
    (d.speaker.phone ? "<dt>Phone</dt><dd>" + esc(d.speaker.phone) + "</dd>" : "") +
    (d.speaker.email ? "<dt>Email</dt><dd>" + esc(d.speaker.email) + "</dd>" : "") +
    (d.speaker.pronunciation ? "<dt>Say</dt><dd>" + esc(d.speaker.pronunciation) + "</dd>" : "") +
    "</dl></div>" +
    '<div class="rec"><p class="rec-head">Say your name</p>' +
    '<p class="sub" style="margin:0 0 .6rem">A few seconds is plenty. Your moderator ' +
    "listens to this before introducing you, so it is worth more than any spelling.</p>" +
    '<div class="rec-row">' +
      '<button class="rec-btn" id="rec-go"><span class="rec-dot"></span>Record</button>' +
      '<button class="rec-btn" id="rec-play" hidden>Play</button>' +
      '<button class="rec-btn" id="rec-clear" hidden>Remove</button>' +
    "</div>" +
    '<p class="rec-status" id="rec-status">' +
      (d.speaker.has_name_audio ? "We have a recording of your name." : "") + "</p>" +
    '<p class="rec-file">Or upload one: <input type="file" id="rec-file" accept="audio/*"></p>' +
    "</div></section>";

  const bioPanel =
    '<section id="bio"><h2>Your biography</h2>' +
    '<p class="sub">Write this once and we keep it. It is what the moderator reads out, ' +
    "what goes beside your name when we promote the program, and what we reuse the next " +
    "time you speak \u2014 so you should not be asked for it again.</p>" +
    '<div class="panel"><div class="bio-form">' +

    '<label class="up-label" for="bio-short">Short version \u2014 for your introduction on air</label>' +
    '<textarea id="bio-short" rows="3" placeholder="Two sentences. Who you are, where you practice, ' +
    'and the one thing that makes you worth listening to on this topic."></textarea>' +
    '<p class="bio-count" id="bio-short-count">&nbsp;</p>' +

    '<label class="up-label" for="bio-full">Full version \u2014 for the program listing</label>' +
    '<textarea id="bio-full" rows="9" placeholder="As long as you like. Plain text is fine; ' +
    'there is no need to format it."></textarea>' +
    '<p class="bio-count" id="bio-full-count">&nbsp;</p>' +

    '<label class="up-label" for="bio-li">LinkedIn (optional)</label>' +
    '<input type="text" id="bio-li" placeholder="https://www.linkedin.com/in/\u2026">' +

    '<button class="btn primary" id="bio-go">Save my biography</button>' +
    '<p class="up-status" id="bio-status">Loading what we already have\u2026</p>' +

    '<div class="up-sent"><p class="up-head">Your headshot</p>' +
    '<p class="sub" style="margin:0 0 .5rem">Used for NACBA promotion only, and kept against ' +
    "your name rather than one webinar \u2014 send it once and we will not ask again.</p>" +
    '<div class="bio-shot" id="bio-shot-now"></div>' +
    '<p class="up-file" style="margin-top:.5rem">' +
    '<input type="file" id="bio-shot" accept="image/jpeg,image/png,image/webp"></p>' +
    '<p class="up-status" id="bio-shot-status"></p>' +
    "</div></div></div></section>";

  const uploadPanel =
    "<section id=\"upload\"><h2>Send us your materials</h2>" +
    '<p class="sub">Upload here and it reaches your coordinator directly. Up to 10 MB per file. ' +
    "You can send the same thing again if you need to replace it.</p>" +
    '<div class="panel"><div class="up-form">' +
    '<label class="up-label" for="up-kind">What is this?</label>' +
    '<select id="up-kind">' + UPLOAD_KINDS.map(k =>
      '<option value="' + k.id + '">' + esc(k.label) + "</option>").join("") + "</select>" +
    '<label class="up-label" for="up-file">Choose a file</label>' +
    '<input type="file" id="up-file">' +
    '<button class="btn primary" id="up-go">Upload</button>' +
    '<p class="up-status" id="up-status"></p>' +
    '</div><div class="up-sent"><p class="up-head">What you have sent</p>' +
    '<div id="up-list">' + sentList + "</div></div></div></section>";


  const late = MILESTONES.some(m =>
    m.items.length && addDays(ev, m.off) < today && !m.items.every(i => recv[i]?.received));

  app.innerHTML =
    "<header>" + brand() +
    '<p class="eyebrow">Education Committee · Speaker Packet</p>' +
    "<h1>" + esc(d.program.title) + "</h1>" +
    '<p class="when">' + esc(FMT_FULL.format(ev)) + "  ·  12:00 – 1:30 p.m. Pacific  ·  " +
    (days < 0 ? Math.abs(days) + " days ago" : (days === 0 ? "today" : days + " days away")) +
    '</p><p class="greet">Thank you for presenting for NACBA, <b>' +
    esc(d.speaker.full_name) + "</b>." +
    (d.topic ? " Your topic on this program is <b>" + esc(d.topic) + "</b>." : "") +
    "</p></header>" +

    (late ? '<div class="callout warn"><span class="label">Something is overdue</span>' +
      "<p>One or more items below have passed their date. If you have already sent them, " +
      "they may simply not be logged yet — a quick note to your coordinator will sort it " +
      "out.</p></div>" : "") +

    '<div class="layout"><div class="main">' +

      "<section><h2>What we need, and when</h2>" +
      '<p class="sub">Dates are specific to your program. Open <em>what this involves</em> ' +
      "on any item for the detail. Green means NACBA has it.</p>" +
      '<div class="panel"><div class="dl">' + rows + "</div></div>" +
      '<div class="callout"><span class="label">The date that really matters</span>' +
      "<p>Written materials are final one week before the program. That is what gives us " +
      "time to review them and get them to members — and, where the program carries CLE " +
      "credit, to file the accreditation applications.</p></div></section>" +

      bioPanel +

      uploadPanel +

    '</div><aside class="side">' + coPanel + nacbaPanel + detailsPanel + "</aside></div>" +

    '<div class="actions"><button class="btn" id="print">Save this page as a PDF</button>' +
    '<span class="hint">Everything above, with your dates, as a file you can keep.</span></div>' +

    "<footer><p class=\"foot\">National Association of Consumer Bankruptcy Attorneys<br>" +
    'Questions: <a href="mailto:admin@nacba.com">admin@nacba.com</a> · (800) 499-9040<br>' +
    "This page is personal to you. Please don't forward the link.<br>" +
    '<span class="printed">Prepared for ' + esc(d.speaker.full_name) + " · " +
    esc(FMT_DATE.format(todayUTC())) + "</span></p></footer>";

  document.getElementById("print")?.addEventListener("click", () => window.print());
  wireRecorder(d);
  wireBio(d);

  /* jump from a deadline row straight into the uploader, preselected */
  document.querySelectorAll("[data-jump]").forEach(el =>
    el.addEventListener("click", () => {
      const sel = document.getElementById("up-kind");
      if (sel) sel.value = el.getAttribute("data-jump");
      document.getElementById("upload")?.scrollIntoView({ behavior:"smooth", block:"start" });
      document.getElementById("up-file")?.focus();
    }));

  /* upload */
  const go = document.getElementById("up-go");
  go?.addEventListener("click", async () => {
    const input = document.getElementById("up-file");
    const status = document.getElementById("up-status");
    const file = input.files && input.files[0];
    const say = (msg, cls) => { status.textContent = msg; status.className = "up-status " + (cls||""); };

    if (!file) { say("Choose a file first.", "err"); return; }
    if (file.size === 0) { say("That file is empty.", "err"); return; }
    if (file.size > MAX_BYTES) {
      say("That file is " + kb(file.size) + ". The limit is 10 MB — please email it to your coordinator instead.", "err");
      return;
    }

    go.disabled = true; say("Uploading " + file.name + "…");
    try {
      const b64 = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload  = () => res(String(r.result).split(",")[1] || "");
        r.onerror = () => rej(new Error("read failed"));
        r.readAsDataURL(file);
      });
      const { data: res, error } = await sb.rpc("speaker_upload", {
        tok, kind: document.getElementById("up-kind").value,
        filename: file.name, mime: file.type || "", b64
      });
      if (error)      { say("That didn't send. Please try again, or email your coordinator.", "err"); }
      else if (!res?.ok) { say(res?.error || "That didn't send.", "err"); }
      else {
        packet.uploads = [res.upload, ...(packet.uploads || [])];
        say("Sent — thank you. " + file.name + " reached your coordinator.", "ok");
        input.value = "";
        const keep = status.textContent, cls = status.className;
        render(packet);                       // refresh badges and the sent list
        const s2 = document.getElementById("up-status");
        if (s2) { s2.textContent = keep; s2.className = cls; }
      }
    } catch (e) {
      say("That file couldn't be read. Please try a different one.", "err");
    } finally {
      const b = document.getElementById("up-go");
      if (b) b.disabled = false;
    }
  });
}

let tok = "", packet = null;

/* A collapsed pop-out would print as a missing paragraph, so open them all
   for the printed copy and put them back afterwards. */
let reopened = [];
window.addEventListener("beforeprint", () => {
  reopened = [...document.querySelectorAll("details.more:not([open])")];
  reopened.forEach(d => { d.open = true; });
});
window.addEventListener("afterprint", () => {
  reopened.forEach(d => { d.open = false; });
  reopened = [];
});

/* Recording the speaker's own name. MediaRecorder needs a secure context
   and permission; where it is unavailable the file picker still works, so
   a voice memo from a phone does the same job. */
/* ------------------------------------------------------------------
   The bio builder. Loads whatever we already hold, so a returning
   speaker edits rather than retypes, and saves against the person
   rather than this one booking.
   ------------------------------------------------------------------ */
function wireBio(d){
  const shortEl  = document.getElementById("bio-short");
  const fullEl   = document.getElementById("bio-full");
  const liEl     = document.getElementById("bio-li");
  const go       = document.getElementById("bio-go");
  const status   = document.getElementById("bio-status");
  const shotIn   = document.getElementById("bio-shot");
  const shotNow  = document.getElementById("bio-shot-now");
  const shotStat = document.getElementById("bio-shot-status");
  if (!shortEl || !go) return;

  const say = (el, msg, cls) => {
    if (!el) return;
    el.textContent = msg; el.className = "up-status " + (cls || "");
  };

  /* Word counts, because "about 60 words" is useless without one. */
  const words = t => (t.trim() ? t.trim().split(/\s+/).length : 0);
  const count = (src, out, limit) => {
    const el = document.getElementById(out); if (!el) return;
    const n = words(src.value);
    el.textContent = n + (n === 1 ? " word" : " words") +
      (limit ? " \u00b7 aim for under " + limit : "");
    el.className = "bio-count" + (limit && n > limit ? " over" : "");
  };
  const recount = () => {
    count(shortEl, "bio-short-count", 60);
    count(fullEl,  "bio-full-count",  0);
  };
  shortEl.addEventListener("input", recount);
  fullEl.addEventListener("input", recount);

  const showShot = (at) =>
    shotNow.innerHTML = at
      ? '<span class="up-kind">on file</span><span class="up-meta">sent ' +
        esc(FMT_DATE.format(new Date(at))) + "</span>"
      : '<span class="up-empty">Nothing on file yet.</span>';

  /* ---- load ---- */
  (async () => {
    try {
      const { data: r, error } = await sb.rpc("speaker_bio", { tok });
      if (error || !r?.ok) {
        say(status, "", ""); recount(); showShot(null); return;
      }
      shortEl.value = r.bio_short || "";
      fullEl.value  = r.bio || "";
      liEl.value    = r.linkedin || "";
      recount();
      showShot(r.has_headshot ? (r.headshot_at || true) : null);
      say(status, r.bio_updated_at
        ? "Last saved " + FMT_DATE.format(new Date(r.bio_updated_at)) +
          (r.bio_updated_by === "staff" ? " by NACBA \u2014 please check it reads as you would write it." : ".")
        : "", r.bio_updated_by === "staff" ? "" : "");
    } catch (e) { say(status, "", ""); recount(); showShot(null); }
  })();

  /* ---- save the text ---- */
  go.addEventListener("click", async () => {
    if (!shortEl.value.trim() && !fullEl.value.trim()) {
      say(status, "Write something first \u2014 even a couple of sentences helps.", "err"); return;
    }
    go.disabled = true; say(status, "Saving\u2026");
    try {
      const { data: r, error } = await sb.rpc("speaker_save_bio", {
        tok, p_bio: fullEl.value, p_bio_short: shortEl.value, p_linkedin: liEl.value
      });
      if (error)         say(status, "That didn't save. Please try again, or email your coordinator.", "err");
      else if (!r?.ok)   say(status, r?.error || "That didn't save.", "err");
      else               say(status, "Saved \u2014 thank you. We will not ask you for this again.", "ok");
    } catch (e) {
      say(status, "That didn't save. Please try again, or email your coordinator.", "err");
    }
    go.disabled = false;
  });

  /* ---- save the headshot ---- */
  shotIn?.addEventListener("change", async () => {
    const file = shotIn.files && shotIn.files[0];
    if (!file) return;
    if (file.size === 0)         { say(shotStat, "That file is empty.", "err"); return; }
    if (file.size > MAX_BYTES)   { say(shotStat, "That image is " + kb(file.size) +
                                     ". The limit is 10 MB.", "err"); return; }
    say(shotStat, "Sending " + file.name + "\u2026");
    try {
      const b64 = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload  = () => res(String(r.result).split(",")[1] || "");
        r.onerror = () => rej(new Error("read failed"));
        r.readAsDataURL(file);
      });
      const { data: r, error } = await sb.rpc("speaker_save_headshot", {
        tok, p_mime: file.type || "", p_b64: b64
      });
      if (error)       say(shotStat, "That didn't send. Please try again.", "err");
      else if (!r?.ok) say(shotStat, r?.error || "That didn't send.", "err");
      else {
        say(shotStat, "Got it \u2014 thank you. " + kb(r.bytes) + " saved to your record.", "ok");
        showShot(r.saved_at); shotIn.value = "";
      }
    } catch (e) { say(shotStat, "That didn't send. Please try again.", "err"); }
  });
}

function wireRecorder(d){
  const go     = document.getElementById("rec-go");
  const play   = document.getElementById("rec-play");
  const clear  = document.getElementById("rec-clear");
  const file   = document.getElementById("rec-file");
  const status = document.getElementById("rec-status");
  if (!go) return;

  const say = (t, cls) => { status.textContent = t; status.className = "rec-status " + (cls||""); };
  let rec = null, chunks = [], stream = null, timer = null, url = null;

  const canRecord = !!(navigator.mediaDevices?.getUserMedia && window.MediaRecorder);
  if (!canRecord) {
    go.hidden = true;
    say("Recording is not available in this browser — please upload a file instead.");
  }
  if (d.speaker.has_name_audio) { play.hidden = false; clear.hidden = false; }

  const b64 = blob => new Promise((res, rej) => {
    const r = new FileReader();
    r.onload  = () => res(String(r.result).split(",")[1] || "");
    r.onerror = () => rej(new Error("read failed"));
    r.readAsDataURL(blob);
  });

  async function save(blob, mime){
    if (blob.size > 2*1024*1024) {
      say("That is over 2 MB. A few seconds is all we need.", "err"); return;
    }
    say("Saving…");
    try {
      const { data: r, error } = await sb.rpc("speaker_record_name",
        { tok, p_mime: mime || blob.type || "audio/webm", p_b64: await b64(blob) });
      if (error || !r?.ok) { say(r?.error || "That did not save. Please try again.", "err"); return; }
      d.speaker.has_name_audio = true;
      play.hidden = false; clear.hidden = false;
      say("Saved — thank you.", "ok");
    } catch (e) { say("That did not save. Please try again.", "err"); }
  }

  function stop(){
    if (rec && rec.state !== "inactive") rec.stop();
    stream?.getTracks().forEach(t => t.stop());
    clearTimeout(timer);
    go.classList.remove("on");
    go.innerHTML = '<span class="rec-dot"></span>Record';
  }

  go?.addEventListener("click", async () => {
    if (rec && rec.state === "recording") { stop(); return; }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      say("We could not reach your microphone. Check the browser's permission, or upload a file.", "err");
      return;
    }
    chunks = [];
    rec = new MediaRecorder(stream);
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
      if (url) URL.revokeObjectURL(url);
      url = URL.createObjectURL(blob);
      if (blob.size) save(blob, rec.mimeType);
    };
    rec.start();
    go.classList.add("on");
    go.innerHTML = '<span class="rec-dot"></span>Stop';
    say("Recording — say your name, then press stop.");
    timer = setTimeout(stop, 10000);          // nobody needs longer than ten seconds
  });

  play?.addEventListener("click", async () => {
    if (url) { new Audio(url).play(); return; }
    say("Fetching…");
    const { data, error } = await sb.rpc("speaker_name_audio", { tok });
    if (error || !data) { say("We could not play that back.", "err"); return; }
    const bin = atob(data.b64), buf = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) buf[i] = bin.charCodeAt(i);
    url = URL.createObjectURL(new Blob([buf], { type: data.mime }));
    say(""); new Audio(url).play();
  });

  clear?.addEventListener("click", async () => {
    if (!confirm("Remove your name recording?")) return;
    const { data: r } = await sb.rpc("speaker_record_name", { tok, p_mime: "", p_b64: "" });
    if (r?.ok) {
      d.speaker.has_name_audio = false;
      if (url) { URL.revokeObjectURL(url); url = null; }
      play.hidden = true; clear.hidden = true; say("Removed.");
    } else say("That did not work. Please try again.", "err");
  });

  file?.addEventListener("change", () => {
    const f = file.files && file.files[0];
    if (f) save(f, f.type);
  });
}

(async function () {
  tok = new URLSearchParams(location.search).get("k") || location.hash.replace(/^#/, "");
  if (!tok) { notFound("This page needs the full link from your invitation email."); return; }
  try {
    const { data, error } = await sb.rpc("speaker_packet", { tok });
    if (error) { notFound("We couldn't load your packet just now."); return; }
    if (!data)  { notFound("This link is no longer active."); return; }
    packet = data;
    render(packet);
  } catch (e) {
    notFound("We couldn't load your packet just now.");
  }
})();
</script>
</body>
